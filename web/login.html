<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'">
    <title>LiteCode · 登录</title>
    <!-- Phase 5 ★ 深色模式 / SPEC §6.3 / A34 — no-flash theme bootstrap. -->
    <script src="/js/theme-boot.js?v=1.3.3.2"></script>
    <link rel="stylesheet" href="/css/style.css?v=1.3.3.2">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='10' fill='%230B0E14'/%3E%3Ctext x='14' y='42' font-family='JetBrains Mono, monospace' font-size='28' font-weight='700' fill='%235DC9E2'%3E%26lt%3B/%3E%3C/svg%3E">
</head>
<body>
    <!--
      v1.3.3.4 — 蓝白卡密型 auth split。
      左侧:深蓝渐变 hero + 卖点 + 评价引用;
      右侧:浅色背景 form card,简易输入字段。
      API / 字段 ID 完全保留 v1.2.49-a 协议。
    -->
    <div class="lc-v4-auth">
        <aside class="lc-v4-auth__side">
            <a class="lc-v4-auth__brand" href="/index.html">
                <span>&gt;</span>
                <span>LiteCode OJ</span>
            </a>

            <div class="lc-v4-auth__pitch">
                <span class="lc-v4-eyebrow lc-v4-eyebrow--dark">
                    自部署 C++ 在线判题
                </span>
                <h2 style="margin-top:16px;">写代码,<em>等判词</em>。</h2>
                <p>
                    20 道题起步 · 6 种判题模式 · Special Judge 支持 ·
                    Docker 一键起。登录后开始刷题,提交即得反馈。
                </p>
                <div class="lc-v4-auth__chips">
                    <span class="lc-v4-auth__chip">C++ / C</span>
                    <span class="lc-v4-auth__chip">Special Judge</span>
                    <span class="lc-v4-auth__chip">浮点容差</span>
                    <span class="lc-v4-auth__chip">真实评测</span>
                </div>
                <blockquote class="lc-v4-auth__quote">
                    把题交出去,判词马上回来 — 不是冷冰冰的 0 / 1,
                    是哪一行过了、哪一行没过、用时多少。
                    <span class="lc-v4-auth__quote-source">— v1.3.0 评测管道重构后</span>
                </blockquote>
            </div>

            <div class="lc-v4-auth__side-footer">
                <a href="/index.html">首页</a>
                <a href="/ranking.html">榜单</a>
                <a href="/register.html">注册</a>
            </div>
        </aside>

        <main class="lc-v4-auth__pane">
            <form class="lc-v4-auth__form" id="login-form" novalidate>
                <h1>欢迎回来</h1>
                <p class="lc-v4-auth__form-sub">登录后即可继续刷题,提交历史自动归档。</p>

                <div class="lc-v4-auth__field">
                    <label class="lc-v4-auth__label" for="username">用户名</label>
                    <input
                        class="lc-v4-auth__input"
                        type="text"
                        id="username"
                        name="username"
                        autocomplete="username"
                        autocapitalize="off"
                        autocorrect="off"
                        spellcheck="false"
                        placeholder="3-50 个字符 · 仅支持字母、数字与 ._-"
                        required
                        minlength="3"
                        maxlength="50"
                        pattern="[A-Za-z0-9_.\-]+"
                        aria-describedby="username-help">
                    <span id="username-help" class="lc-v4-auth__field-help">
                        这是你的标识,提交记录会出现在它下面。
                    </span>
                </div>

                <div class="lc-v4-auth__field">
                    <label class="lc-v4-auth__label" for="password">密码</label>
                    <input
                        class="lc-v4-auth__input"
                        type="password"
                        id="password"
                        name="password"
                        autocomplete="current-password"
                        placeholder="8-72 个字符 · 区分大小写"
                        required
                        minlength="8"
                        maxlength="72"
                        aria-describedby="password-help">
                    <span id="password-help" class="lc-v4-auth__field-help">
                        忘记密码?目前不支持重置,请联系管理员。
                    </span>
                </div>

                <div id="form-error" class="lc-v4-auth__err" role="alert" aria-live="polite"></div>

                <button type="submit"
                        class="lc-v4-btn lc-v4-btn--primary lc-v4-auth__submit"
                        id="submit-btn">
                    登录 LiteCode
                </button>

                <div class="lc-v4-auth__alt">
                    还没有账号?<a href="/register.html">立即注册</a>
                </div>
            </form>
        </main>
    </div>

    <script src="/js/csp.js?v=1.3.3.2" defer></script>
    <script src="/js/api.js?v=1.3.3.2" defer></script>
    <script src="/js/app.js?v=1.3.3.2" defer></script>

    <script>
    (function () {
        'use strict';

        // v1.2.49-a: same client-side validation as the legacy
        // login.html (USERNAME_RE / open-redirect guard). The visual
        // layer is new in v1.3.3.4 (lc-v4-auth split); the contract
        // is identical.
        var USERNAME_RE = /^[A-Za-z0-9_.\-]{3,50}$/;

        function resolveNext(rawNext) {
            var fallback = '/index.html';
            if (!rawNext) return fallback;
            if (rawNext.charAt(0) !== '/') return fallback;
            if (rawNext.charAt(1) === '/') return fallback;
            if (/[\x00-\x1f]/.test(rawNext)) return fallback;
            return rawNext;
        }

        window.addEventListener('DOMContentLoaded', function () {
            litecode.boot.shell({ guestOnly: true });

            var form       = document.getElementById('login-form');
            var submit     = document.getElementById('submit-btn');
            var errorBox   = document.getElementById('form-error');
            var usernameEl = document.getElementById('username');
            var passwordEl = document.getElementById('password');

            var next = resolveNext(
                new URLSearchParams(window.location.search).get('next')
            );

            if (usernameEl && !usernameEl.value) {
                usernameEl.focus();
            } else if (passwordEl && !passwordEl.value) {
                passwordEl.focus();
            } else if (usernameEl) {
                usernameEl.focus();
            }

            function setError(msg, field) {
                errorBox.textContent = msg || '';
                errorBox.classList.toggle('lc-v4-auth__err--on', !!msg);
                if (field) {
                    var target = document.getElementById(field);
                    if (target) {
                        target.style.borderColor = msg ? '#dc2626' : '';
                        target.style.boxShadow    = msg
                            ? '0 0 0 4px rgba(220, 38, 38, 0.14)'
                            : '';
                        try { target.focus(); } catch (_) {}
                    }
                }
            }

            form.addEventListener('submit', function (e) {
                e.preventDefault();
                setError('');

                var username = (usernameEl.value || '').trim();
                var password = passwordEl.value || '';

                if (!username || !password) {
                    setError('缺少必填字段', username ? 'password' : 'username');
                    return;
                }
                if (!USERNAME_RE.test(username)) {
                    setError('用户名格式不合法(3-50 个字符,仅支持字母、数字与 ._-)', 'username');
                    return;
                }
                if (password.length < 8 || password.length > 72) {
                    setError('密码长度需在 8-72 个字符之间', 'password');
                    return;
                }

                submit.disabled = true;
                submit.textContent = '登录中…';

                litecode.api.auth.login(username, password)
                    .then(function (data) {
                        var uname = (data && data.user && data.user.username) || username;
                        litecode.toast.success('AC · 欢迎回来,' + uname);
                        window.location.replace(next);
                    })
                    .catch(function (err) {
                        var msg;
                        switch (err.code) {
                            case 'RATE_LIMITED':
                                msg = '尝试次数过多,请等待一分钟后重试';
                                break;
                            case 'INVALID_INPUT':
                                msg = err.message || '输入被服务端拒绝';
                                if (err.details && err.details.field) {
                                    setError(msg, err.details.field);
                                    return;
                                }
                                break;
                            case 'UNAUTHORIZED':
                                msg = '用户名或密码错误';
                                break;
                            case 'INTERNAL_ERROR':
                                msg = '无法连接服务端:' + (err.message || '未知错误');
                                break;
                            default:
                                msg = err.message || ('异常:HTTP ' + (err.status || 0));
                        }
                        setError(msg);
                        if (err.status !== 401) {
                            litecode.toast.error(msg);
                        }
                    })
                    .finally(function () {
                        submit.disabled = false;
                        submit.textContent = '登录 LiteCode';
                    });
            });
        });
    })();
    </script>
</body>
</html>
