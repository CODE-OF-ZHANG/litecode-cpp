<!DOCTYPE html>
<html lang="zh-CN" data-theme-chosen>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'">
    <title>LiteCode · 登录</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <!--
      Login page — Phase 5 ★ 登录页面（/login.html）.

      Guest-only: any authed user is bounced to /index.html before the
      form renders (see `litecode.boot.shell({ guestOnly: true })`).
      The page deliberately does NOT mount the shared nav because a
      navigation bar with "登录 / 注册" buttons is misleading on a page
      that's about to set the auth state; theme is still applied via
      `boot.shell`, so dark-mode users see the right colors immediately.

      Failure handling mirrors SPEC §5.7 — the backend returns a uniform
      envelope, litecode.api surfaces it as a LitecodeApiError, and this
      page branches on `err.code` to map:
          RATE_LIMITED     → "尝试过于频繁"   (HTTP 429)
          INVALID_INPUT    → err.message       (HTTP 400, with details.field)
          UNAUTHORIZED     → "用户名或密码错误" (HTTP 401, anti-enumeration)
          INTERNAL_ERROR   → generic message   (HTTP 5xx)
      Anti-enumeration: "no such user" and "wrong password" share the
      same UNAUTHORIZED envelope + same user-facing message — no oracle
      for username enumeration.

      After successful login, the page navigates to `?next=` (with a
      safety check against open-redirects — only same-origin paths are
      honored) or `/index.html` by default. `window.location.replace`
      is used so the form post isn't replayed by the back button.
    -->
    <main class="lc-auth-page">
        <div class="lc-auth-card">
            <h1>登录 LiteCode</h1>
            <p class="lc-auth-subtitle">使用账号密码登录。</p>

            <form class="lc-form" id="login-form" novalidate>
                <div class="lc-form-row">
                    <label for="username" class="lc-form-label">用户名</label>
                    <input
                        type="text"
                        id="username"
                        name="username"
                        class="lc-input"
                        autocomplete="username"
                        autocapitalize="off"
                        autocorrect="off"
                        spellcheck="false"
                        required
                        minlength="3"
                        maxlength="50"
                        pattern="[A-Za-z0-9_.-]+"
                        aria-describedby="username-help">
                    <span id="username-help" class="lc-form-help">
                        注册时使用的用户名（3-50 字符）。
                    </span>
                </div>
                <div class="lc-form-row">
                    <label for="password" class="lc-form-label">密码</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        class="lc-input"
                        autocomplete="current-password"
                        required
                        minlength="8"
                        maxlength="72"
                        aria-describedby="password-help">
                    <span id="password-help" class="lc-form-help">
                        8-72 字符；区分大小写。
                    </span>
                </div>
                <div id="form-error" class="lc-form-error" role="alert" aria-live="polite"></div>
                <button type="submit" class="lc-btn lc-btn--primary lc-btn--block" id="submit-btn">
                    登录
                </button>
            </form>

            <div class="lc-auth-footer">
                还没有账号？<a href="/register.html">立即注册</a>
                <span class="lc-auth-footer-sep">·</span>
                <a href="/index.html">返回首页</a>
            </div>
        </div>
    </main>

    <script src="/js/csp.js" defer></script>
    <script src="/js/api.js" defer></script>
    <script src="/js/app.js" defer></script>

    <script>
        // ────────────────────────────────────────────────────────────────
        //  Page-local script — kept inline because it is single-purpose
        //  and tightly coupled to this page's DOM. The login handler is
        //  intentionally short: validate → POST → branch on err.code.
        //
        //  Concerns handled:
        //   1. guestOnly bounce (authed users → /index.html)
        //   2. open-redirect protection on `?next=` (same-origin only)
        //   3. front-end shape validation matching backend regexes
        //   4. loading state (disabled button + "登录中…") during the
        //      network round-trip
        //   5. anti-enumeration: same 401 message for missing user vs
        //      wrong password (matches SPEC §15.1 + backend auth_routes.h)
        //   6. auto-focus first empty field — keyboard users land on
        //      the form without needing to mouse-then-tab
        // ────────────────────────────────────────────────────────────────

        (function () {
            'use strict';

            // Mirror register.html's regexes so users get consistent
            // feedback between the two pages. The backend re-validates
            // (SPEC §6.3 "前端校验，后端二次校验") so this is purely
            // for UX, not security.
            var USERNAME_RE = /^[A-Za-z0-9_.-]{3,50}$/;

            // Resolve the post-login redirect target. We only accept
            // SAME-ORIGIN paths starting with "/" (and not "//" — that's
            // a protocol-relative URL that an attacker could exploit to
            // bounce the user to their own origin). Anything else falls
            // back to /index.html. This is the open-redirect guard
            // referenced in the page header comment.
            function resolveNext(rawNext) {
                var fallback = '/index.html';
                if (!rawNext) return fallback;
                // Must start with single "/" — reject protocol-relative
                // ("//evil.com") and absolute ("http://...").
                if (rawNext.charAt(0) !== '/') return fallback;
                if (rawNext.charAt(1) === '/') return fallback;
                // Reject newlines / control chars (defense in depth —
                // URLSearchParams already strips these, but if a future
                // refactor switches to a different parser we keep the
                // guarantee).
                if (/[\x00-\x1f]/.test(rawNext)) return fallback;
                return rawNext;
            }

            window.addEventListener('DOMContentLoaded', function () {
                litecode.boot.shell({ guestOnly: true, title: 'LiteCode · 登录' });

                var form       = document.getElementById('login-form');
                var submit     = document.getElementById('submit-btn');
                var errorBox   = document.getElementById('form-error');
                var usernameEl = document.getElementById('username');
                var passwordEl = document.getElementById('password');

                // Resolve `?next=` ONCE so a slow submit can't observe
                // a changing window.location.search.
                var next = resolveNext(
                    new URLSearchParams(window.location.search).get('next')
                );

                // Auto-focus the first empty field — username if empty,
                // password if username is filled. Skip if either is
                // already pre-filled (autofill from browser / password
                // manager) — focus on a populated field is annoying.
                if (usernameEl && !usernameEl.value) {
                    usernameEl.focus();
                } else if (passwordEl && !passwordEl.value) {
                    passwordEl.focus();
                } else if (usernameEl) {
                    usernameEl.focus();
                }

                function setError(msg, field) {
                    errorBox.textContent = msg || '';
                    errorBox.style.display = msg ? 'block' : 'none';
                    if (field) {
                        var el = document.getElementById(field);
                        if (el) {
                            try { el.focus(); } catch (_) { /* element may be detached */ }
                        }
                    }
                }

                form.addEventListener('submit', function (e) {
                    e.preventDefault();
                    setError('');

                    var username = (usernameEl.value || '').trim();
                    var password = passwordEl.value || '';

                    if (!username || !password) {
                        setError('用户名和密码不能为空', username ? 'password' : 'username');
                        return;
                    }
                    if (!USERNAME_RE.test(username)) {
                        setError('用户名格式不正确（3-50 字符，字母/数字/下划线/点/中划线）', 'username');
                        return;
                    }
                    if (password.length < 8 || password.length > 72) {
                        setError('密码长度需为 8-72 字符', 'password');
                        return;
                    }

                    submit.disabled = true;
                    submit.textContent = '登录中…';

                    litecode.api.auth.login(username, password)
                        .then(function (data) {
                            var uname = (data && data.user && data.user.username) || username;
                            litecode.toast.success('登录成功，欢迎回来 ' + uname + '！');
                            // Use `replace` so the back button doesn't
                            // replay the POST (which would 401 because
                            // sessionStorage is empty after navigation).
                            window.location.replace(next);
                        })
                        .catch(function (err) {
                            // The `code` is the SPEC §5.7 envelope field,
                            // NOT the HTTP status. Both go through
                            // LitecodeApiError; `code` is the machine-
                            // readable taxonomy, `status` is the HTTP
                            // number — branch on the former for message
                            // mapping.
                            var msg;
                            switch (err.code) {
                                case 'RATE_LIMITED':
                                    msg = '登录尝试过于频繁，请稍后再试';
                                    break;
                                case 'INVALID_INPUT':
                                    // err.details.field (when present)
                                    // tells us which input failed server-
                                    // side validation. We don't branch
                                    // the message here — we just focus
                                    // the offending field.
                                    msg = err.message || '输入有误';
                                    if (err.details && err.details.field) {
                                        setError(msg, err.details.field);
                                        return;
                                    }
                                    break;
                                case 'UNAUTHORIZED':
                                    // Anti-enumeration: same envelope for
                                    // "no such user" and "wrong password"
                                    // (see auth_routes.h::login_handler).
                                    // Don't reveal which one failed.
                                    msg = '用户名或密码错误';
                                    break;
                                case 'INTERNAL_ERROR':
                                    msg = '服务暂时不可用：' + (err.message || '');
                                    break;
                                default:
                                    msg = err.message || ('登录失败（HTTP ' + (err.status || 0) + '）');
                            }
                            setError(msg);
                            // Also surface a toast so users who didn't
                            // notice the inline error (e.g. screen-reader
                            // users jumping past the alert region) still
                            // get the feedback. Skip on 401 — the toast
                            // layer dedupes via the litecode:api-error
                            // event but a single 401 + inline error is
                            // redundant.
                            if (err.status !== 401) {
                                litecode.toast.error(msg);
                            }
                        })
                        .finally(function () {
                            submit.disabled = false;
                            submit.textContent = '登录';
                        });
                });
            });
        })();
    </script>
</body>
</html>
