<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'">
    <meta name="description" content="LiteCode · 全局讨论区">
    <title>LiteCode · 讨论区</title>
    <script src="/js/theme-boot.js?v=1.3.5"></script>
    <link rel="preload" href="/css/style.css?v=1.3.5" as="style">
    <link rel="stylesheet" href="/css/style.css?v=1.3.5">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23F8F6F0'/%3E%3Cpath d='M22 18 L42 32 L22 46' stroke='%234D7C5A' stroke-width='5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
    <style>
    /* Markdown 编辑器容器样式 */
    #md-editor-wrap {
        border: 1px solid var(--lc-color-border);
        border-radius: var(--lc-radius-md);
        background: var(--lc-color-surface);
        overflow: hidden;
        min-height: 200px;
        height: 200px;
    }
    #md-editor-wrap textarea {
        width: 100%;
        height: 100%;
        resize: none;
        font-family: var(--lc-font-mono, ui-monospace, "SFMono-Regular", Consolas, monospace);
        font-size: 14px;
        line-height: 1.6;
        padding: 12px;
        border: none;
        background: var(--lc-color-surface);
        color: var(--lc-color-text);
    }
    #md-editor-wrap textarea:focus {
        outline: none;
    }
    /* Ace 编辑器覆盖层 */
    #md-editor-wrap.ace_editor,
    #md-editor-wrap.lc-editor-shell {
        height: 100% !important;
        min-height: 200px;
    }
    </style>
</head>
<body class="lc-cyber">
    <div class="lc-cyber-grid-strip" aria-hidden="true"></div>
    <div class="lc-v4-bg-oat"   aria-hidden="true"></div>
    <div class="lc-v4-bg-aurora" aria-hidden="true"></div>
    <div class="lc-v4-spotlight"  aria-hidden="true"></div>
    <div class="lc-v4-deco lc-v4-deco--tl" aria-hidden="true">
        <svg viewBox="0 0 60 60" fill="none"><path d="M4 50 L4 14 L40 4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
    <div class="lc-v4-deco lc-v4-deco--tr" aria-hidden="true">
        <svg viewBox="0 0 60 60" fill="none"><path d="M10 30 L48 30 M30 12 L30 48 M38 22 L48 30 L38 38" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
    <div class="lc-v4-deco lc-v4-deco--bl" aria-hidden="true">
        <svg viewBox="0 0 60 60" fill="none"><path d="M4 30 L40 30 M22 14 L4 30 L22 46" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
    <div class="lc-v4-deco lc-v4-deco--br" aria-hidden="true">
        <svg viewBox="0 0 60 60" fill="none"><path d="M56 10 L56 46 L20 56" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
    <div class="lc-v4-watermark lc-v4-watermark--br" aria-hidden="true">
        <svg viewBox="0 0 64 64"><path d="M22 18 L42 32 L22 46" stroke='%234D7C5A' stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>

    <div data-nav></div>

    <main class="lc-v4-page">
        <header class="lc-v4-page-header" id="list-header">
            <div class="lc-v4-page-header__row">
                <a href="/index.html">首页</a>
                <span>讨论区</span>
            </div>
            <h1 class="lc-v4-page-header__title">全局讨论区</h1>
            <p class="lc-v4-page-header__desc">分享思路、交流心得、互助解答</p>
        </header>

        <!-- 讨论详情页（?id=X 时显示）-->
        <section id="discussion-detail" class="lc-card" hidden>
            <div class="lc-card__body">
                <div class="lc-detail-header" id="detail-breadcrumb">
                    <a href="/discuss.html" class="lc-detail-back">← 返回讨论区</a>
                </div>
                <h2 class="lc-detail-title" id="detail-title"></h2>
                <div class="lc-detail-meta" id="detail-meta"></div>
                <div class="lc-detail-problem" id="detail-problem" hidden></div>
                <div class="lc-detail-content" id="detail-content"></div>
                <div class="lc-detail-actions">
                    <button type="button" class="lc-btn lc-btn--ghost" id="detail-like-btn">
                        <span id="detail-like-icon">❤️</span>
                        <span id="detail-like-count">0</span> 赞
                    </button>
                    <button type="button" class="lc-btn lc-btn--ghost" id="detail-reply-btn">
                        💬 <span id="detail-reply-count">0</span> 回复
                    </button>
                </div>
            </div>
        </section>

        <!-- 回复列表 -->
        <section id="reply-section" class="lc-card" hidden style="margin-top: 16px;">
            <div class="lc-card__header">
                <h3 id="reply-count-label">回复</h3>
            </div>
            <div id="reply-list"></div>
        </section>

        <!-- 回复表单 -->
        <section id="reply-form-section" class="lc-card" hidden style="margin-top: 16px;">
            <div class="lc-card__body">
                <form id="reply-form">
                    <div class="lc-form-group">
                        <label for="reply-content">写下你的回复</label>
                        <textarea id="reply-content" class="lc-input" rows="3"
                                  placeholder="回复内容（1-10000字）" maxlength="10000" required></textarea>
                    </div>
                    <div class="lc-form-actions">
                        <button type="submit" class="lc-btn lc-btn--primary" id="submit-reply-btn">发布回复</button>
                    </div>
                </form>
            </div>
        </section>

        <!-- 发帖区域（登录后可见）- LeetCode 风格 -->
        <div id="create-discussion-box" class="lc-card" hidden>
            <div class="lc-card__body">
                <div class="lc-discuss-input-box">
                    <div class="lc-discuss-input-box__header" id="discuss-user-header">
                        <span class="lc-avatar lc-avatar--md" id="discuss-user-avatar"></span>
                        <span class="lc-discuss-username" id="discuss-username"></span>
                    </div>
                    <form id="create-discussion-form">
                        <div class="lc-form-group" style="margin-bottom:8px;">
                            <input type="text" id="discussion-title" name="title"
                                   placeholder="标题（1-200字）" maxlength="200" required
                                   style="border:1px solid var(--lc-color-border);border-radius:var(--lc-radius-md);padding:8px 12px;">
                        </div>
                        <div class="lc-discuss-input-box__editor">
                            <div id="md-editor-wrap" class="lc-md-editor-shell">
                                <textarea id="discussion-content" spellcheck="false" autocomplete="off"
                                          autocapitalize="off" placeholder="说点什么..."
                                          maxlength="10000" required></textarea>
                            </div>
                        </div>
                        <div class="lc-discuss-input-box__toolbar">
                            <button type="button" class="lc-btn lc-btn--ghost lc-btn--sm" id="insert-emoji-btn" title="表情">😀</button>
                            <button type="button" class="lc-btn lc-btn--ghost lc-btn--sm" id="insert-mention-btn" title="@某人">@</button>
                            <button type="button" class="lc-btn lc-btn--ghost lc-btn--sm" id="insert-code-btn" title="代码片段">&lt;/&gt;</button>
                            <button type="button" class="lc-btn lc-btn--ghost lc-btn--sm" id="insert-image-btn" title="图片">🖼️</button>
                            <button type="submit" class="lc-btn lc-btn--primary lc-discuss-submit" id="submit-discussion-btn">
                                发表讨论
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <!-- 讨论列表 -->
        <div id="discussion-list">
            <div id="discussion-loading" class="lc-loading">
                <span>加载中...</span>
            </div>
            <div id="discussion-empty" class="lc-empty-state" hidden>
                <svg viewBox="0 0 64 64" width="48" height="48" fill="none">
                    <path d="M8 12h48v36H16l-8 8V12z" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M20 28h24M20 36h16" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
                </svg>
                <p>暂无讨论，来说点什么吧！</p>
            </div>
            <div id="discussion-cards"></div>
        </div>

        <!-- 分页 -->
        <div id="pagination" class="lc-pagination" hidden></div>
    </main>

    <script src="/js/csp.js?v=1.3.5" defer></script>
    <script src="/js/markdown.js?v=1.3.5" defer></script>
    <script src="/js/api.js?v=1.3.5"></script>
    <script src="/js/app.js?v=1.3.5"></script>
    <script src="/js/editor.js?v=1.3.5" defer></script>
    <script>
    (function () {
        'use strict';

        var PAGE_SIZE = 20;
        var currentPage = 0;
        var totalItems = 0;
        var isLoggedIn = false;
        var currentUser = null;

        function init() {
            function doLoad() {
                isLoggedIn = litecode.auth.isLoggedIn();
                currentUser = litecode.auth.currentUser;
                renderAuthState();
                var discussionId = getDiscussionIdFromUrl();
                if (discussionId) {
                    loadDiscussionDetail(discussionId);
                } else {
                    loadDiscussions(0);
                }
            }

            litecode.boot.shell().then(function () {
                doLoad();
            }).catch(function () {
                doLoad();
            });

            litecode.auth.onAuthChanged(function () {
                isLoggedIn = litecode.auth.isLoggedIn();
                currentUser = litecode.auth.currentUser;
                renderAuthState();
            });

            document.getElementById('create-discussion-form').addEventListener('submit', handleCreate);
            document.getElementById('reply-form').addEventListener('submit', handleReply);
            document.getElementById('detail-like-btn').addEventListener('click', handleDetailLike);
        }

        function getDiscussionIdFromUrl() {
            var params = new URLSearchParams(window.location.search);
            var id = params.get('id');
            return id ? parseInt(id, 10) : null;
        }

        function renderAuthState() {
            var box = document.getElementById('create-discussion-box');
            if (isLoggedIn) {
                box.removeAttribute('hidden');
                // 显示用户头像和用户名
                var user = litecode.auth.currentUser;
                var username = user ? user.username : '用户';
                var avatarEl = document.getElementById('discuss-user-avatar');
                var usernameEl = document.getElementById('discuss-username');
                if (user && user.avatar) {
                    avatarEl.innerHTML = '<img src="' + user.avatar + '" class="lc-avatar lc-avatar--md" alt="">';
                } else {
                    avatarEl.innerHTML = '<span class="lc-avatar lc-avatar--md">' + (username.charAt(0).toUpperCase()) + '</span>';
                }
                usernameEl.textContent = username;
                // 登录后初始化 Markdown 编辑器（只初始化一次）
                if (!window._mdEditorInited) {
                    window._mdEditorInited = true;
                    initMarkdownEditor();
                    initToolbarButtons();
                }
            } else {
                box.setAttribute('hidden', '');
            }
        }

        // 工具栏按钮功能
        function initToolbarButtons() {
            document.getElementById('insert-emoji-btn').addEventListener('click', function() {
                insertTextAtCursor('😊');
            });
            document.getElementById('insert-mention-btn').addEventListener('click', function() {
                insertTextAtCursor('@');
            });
            document.getElementById('insert-code-btn').addEventListener('click', function() {
                insertTextAtCursor('\n```\n\n```\n');
            });
            document.getElementById('insert-image-btn').addEventListener('click', function() {
                insertTextAtCursor('![alt](url)');
            });
        }

        function insertTextAtCursor(text) {
            var textarea = document.getElementById('discussion-content');
            if (mdAceEditor) {
                var pos = mdAceEditor.getCursorPosition();
                mdAceEditor.session.insert(pos, text);
                mdAceEditor.focus();
            } else {
                var start = textarea.selectionStart;
                var end = textarea.selectionEnd;
                var value = textarea.value;
                textarea.value = value.substring(0, start) + text + value.substring(end);
                textarea.selectionStart = textarea.selectionEnd = start + text.length;
                textarea.focus();
            }
        }

        // ── Markdown 富文本编辑器（Ace）────────────────────────────────
        var mdAceEditor = null;
        function initMarkdownEditor() {
            // 讨论区暂时使用 textarea 模式，避免 Ace markdown mode 文件缺失问题
            // 如果将来需要更高级的编辑器功能，可以下载 mode-markdown.js 并更新 SRI
            var textarea = document.getElementById('discussion-content');
            if (textarea) textarea.style.display = '';
            return;
        }

        function mountMdEditor() {
            var wrap = document.getElementById('md-editor-wrap');
            var textarea = document.getElementById('discussion-content');
            if (!wrap || !textarea || !window.ace) return;

            wrap.classList.add('lc-editor-shell--loading');
            try {
                // Ace.edit() 需要一个 div 容器，而不是 textarea
                // 将 textarea 隐藏，用 wrap 作为 Ace 的容器
                textarea.style.display = 'none';
                mdAceEditor = window.ace.edit(wrap);
                mdAceEditor.renderer.setOption('maxLines', 30);
                mdAceEditor.renderer.setOption('minLines', 8);
                mdAceEditor.setTheme('ace/theme/tomorrow');
                mdAceEditor.session.setMode('ace/mode/markdown');
                mdAceEditor.setOption('wrap', 80);
                mdAceEditor.setOption('fontSize', 14);
                mdAceEditor.setOption('placeholder', textarea.getAttribute('placeholder'));
                // 同步值到 textarea（用于表单提交）
                mdAceEditor.on('change', function () {
                    textarea.value = mdAceEditor.getValue();
                });
                wrap.classList.remove('lc-editor-shell--loading');
                wrap.classList.add('lc-editor-shell', 'lc-md-editor-shell');
                wrap.classList.add('ace_editor');
                // 设置初始值
                if (textarea.value) {
                    mdAceEditor.setValue(textarea.value, -1);
                }
            } catch (e) {
                wrap.classList.remove('lc-editor-shell--loading');
                console.warn('Ace editor init failed, fallback to textarea:', e);
                textarea.style.display = '';
            }
        }

        function getMdEditorValue() {
            if (mdAceEditor) {
                return mdAceEditor.getValue();
            }
            var textarea = document.getElementById('discussion-content');
            return textarea ? textarea.value : '';
        }

        function loadDiscussions(page) {
            currentPage = page;
            var offset = page * PAGE_SIZE;
            document.getElementById('discussion-loading').removeAttribute('hidden');
            document.getElementById('discussion-empty').setAttribute('hidden', '');
            document.getElementById('discussion-cards').innerHTML = '';
            document.getElementById('pagination').setAttribute('hidden', '');

            litecode.api.discussions.listGlobal({ limit: PAGE_SIZE, offset: offset })
                .then(function (resp) {
                    document.getElementById('discussion-loading').setAttribute('hidden', '');
                    var items = resp.data.items || [];
                    totalItems = resp.data.total || 0;
                    if (items.length === 0) {
                        document.getElementById('discussion-empty').removeAttribute('hidden');
                        return;
                    }
                    renderDiscussions(items);
                    renderPagination();
                })
                .catch(function (err) {
                    document.getElementById('discussion-loading').setAttribute('hidden', '');
                    console.error('loadDiscussions error:', err);
                });
        }

        function renderDiscussions(items) {
            var container = document.getElementById('discussion-cards');
            container.innerHTML = '';
            items.forEach(function (item) {
                var card = createDiscussionCard(item);
                container.appendChild(card);
            });
        }

        function createDiscussionCard(item) {
            var card = document.createElement('div');
            card.className = 'lc-card lc-discussion-card';
            card.dataset.id = item.id;

            var title = item.title || '无标题';
            var content = escapeHtml(item.content || '');
            var preview = content.length > 200 ? content.substring(0, 200) + '...' : content;
            var username = item.user ? item.user.username : '匿名用户';
            var avatar = item.user && item.user.avatar
                ? '<img src="' + item.user.avatar + '" class="lc-avatar lc-avatar--sm" alt="">'
                : '<div class="lc-avatar lc-avatar--sm lc-avatar--guest"></div>';
            var time = formatTime(item.created_at);
            var replyCount = item.reply_count || 0;
            var likeCount = item.like_count || 0;

            // 检查是否有权限删除
            var canDelete = isLoggedIn && currentUser && (
                currentUser.role === 'admin' ||
                item.user_id === currentUser.id
            );
            var deleteBtn = canDelete
                ? '<button type="button" class="lc-btn lc-btn--danger lc-btn--sm" data-action="delete" data-id="' + item.id + '" style="padding:2px 8px;font-size:12px;">🗑️ 删除</button>'
                : '';

            card.innerHTML =
                '<div class="lc-card__body">' +
                    '<div class="lc-discussion-card__header">' +
                        '<div class="lc-discussion-card__user">' + avatar + '<span>' + escapeHtml(username) + '</span></div>' +
                        '<div class="lc-discussion-card__meta">' +
                            '<span class="lc-discussion-card__time">' + time + '</span>' +
                        '</div>' +
                    '</div>' +
                    '<h3 class="lc-discussion-card__title"><a href="/discuss.html?id=' + item.id + '">' + escapeHtml(title) + '</a></h3>' +
                    '<p class="lc-discussion-card__preview">' + preview + '</p>' +
                    '<div class="lc-discussion-card__footer">' +
                        '<span class="lc-discussion-card__stat">' +
                            '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>' +
                            replyCount + ' 回复' +
                        '</span>' +
                        '<span class="lc-discussion-card__stat">' +
                            '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 9V5a3 3 0 00-3-3l-4 9v11h11.28a2 2 0 002-1.7l1.38-9a2 2 0 00-2-2.3H14z"/><path d="M7 22H4a2 2 0 01-2-2v-7a2 2 0 012-2h3"/></svg>' +
                            likeCount + ' 赞' +
                        '</span>' +
                        '<span class="lc-discussion-card__actions">' + deleteBtn + '</span>' +
                    '</div>' +
                '</div>';

            // 绑定删除按钮事件
            var delBtn = card.querySelector('[data-action="delete"]');
            if (delBtn) {
                delBtn.addEventListener('click', function (e) {
                    e.preventDefault();
                    e.stopPropagation();
                    handleListDelete(item.id, delBtn);
                });
            }

            return card;
        }

        function renderPagination() {
            var totalPages = Math.ceil(totalItems / PAGE_SIZE);
            if (totalPages <= 1) return;

            var container = document.getElementById('pagination');
            container.removeAttribute('hidden');
            container.innerHTML = '';

            if (currentPage > 0) {
                var prev = document.createElement('button');
                prev.className = 'lc-btn lc-btn--ghost';
                prev.textContent = '← 上一页';
                prev.addEventListener('click', function () { loadDiscussions(currentPage - 1); });
                container.appendChild(prev);
            }

            var pageInfo = document.createElement('span');
            pageInfo.className = 'lc-pagination__info';
            pageInfo.textContent = (currentPage + 1) + ' / ' + totalPages;
            container.appendChild(pageInfo);

            if (currentPage < totalPages - 1) {
                var next = document.createElement('button');
                next.className = 'lc-btn lc-btn--ghost';
                next.textContent = '下一页 →';
                next.addEventListener('click', function () { loadDiscussions(currentPage + 1); });
                container.appendChild(next);
            }
        }

        // ── Discussion detail view ──────────────────────────────────
        var currentDiscussionId = null;

        function loadDiscussionDetail(id) {
            currentDiscussionId = id;
            // Hide list elements, show detail
            document.getElementById('list-header').hidden = true;
            document.getElementById('create-discussion-box').hidden = true;
            document.getElementById('discussion-list').hidden = true;
            document.getElementById('pagination').hidden = true;

            var detailSection = document.getElementById('discussion-detail');
            detailSection.hidden = false;
            document.getElementById('reply-section').hidden = true;
            document.getElementById('reply-form-section').hidden = true;

            detailSection.querySelector('.lc-card__body').innerHTML =
                '<div class="lc-loading"><span>加载中...</span></div>';

            litecode.api.discussions.get(id)
                .then(function (resp) {
                    renderDiscussionDetail(resp.data);
                })
                .catch(function (err) {
                    detailSection.querySelector('.lc-card__body').innerHTML =
                        '<div class="lc-empty-state"><p>加载失败：' + escapeHtml(err.message || '') + '</p><a href="/discuss.html" class="lc-btn lc-btn--ghost" style="margin-top:16px;">返回讨论区</a></div>';
                });
        }

        function renderDiscussionDetail(discussion) {
            var detailSection = document.getElementById('discussion-detail');
            var body = detailSection.querySelector('.lc-card__body');

            var title = escapeHtml(discussion.title || '无标题');
            var content = discussion.content || '';
            var username = discussion.user ? escapeHtml(discussion.user.username) : '匿名用户';
            var time = formatTime(discussion.created_at);
            var likeCount = discussion.like_count || 0;
            var replyCount = discussion.reply_count || 0;
            var problemSlug = discussion.problem_slug;
            var problemTitle = discussion.problem_title;

            var problemHtml = '';
            if (problemSlug && problemTitle) {
                problemHtml = '<div class="lc-detail-problem">' +
                    '<a href="/problem.html?slug=' + encodeURIComponent(problemSlug) + '">📋 来自题目：' + escapeHtml(problemTitle) + '</a>' +
                    '</div>';
            }

            // 检查当前用户是否有权限删除（currentUser 来自 init 闭包）
            var canDelete = isLoggedIn && currentUser && (
                currentUser.role === 'admin' ||
                discussion.user_id === currentUser.id
            );

            var actionsHtml =
                '<button type="button" class="lc-btn lc-btn--ghost" id="detail-like-btn" data-id="' + discussion.id + '">' +
                    '<span id="detail-like-icon">❤️</span> ' +
                    '<span id="detail-like-count">' + likeCount + '</span> 赞' +
                '</button>' +
                '<button type="button" class="lc-btn lc-btn--ghost" id="detail-reply-btn">' +
                    '💬 <span id="detail-reply-count">' + replyCount + '</span> 回复' +
                '</button>';
            if (canDelete) {
                actionsHtml += '<button type="button" class="lc-btn lc-btn--danger" id="detail-delete-btn" data-id="' + discussion.id + '">🗑️ 删除</button>';
            }

            body.innerHTML =
                '<div class="lc-detail-header" id="detail-breadcrumb">' +
                    '<a href="/discuss.html" class="lc-detail-back">← 返回讨论区</a>' +
                '</div>' +
                '<h2 class="lc-detail-title" id="detail-title">' + title + '</h2>' +
                '<div class="lc-detail-meta" id="detail-meta">' +
                    '<span class="lc-detail-author">' + username + '</span>' +
                    '<span class="lc-detail-time">' + time + '</span>' +
                '</div>' +
                problemHtml +
                '<div class="lc-detail-content" id="detail-content">' + escapeHtml(content) + '</div>' +
                '<div class="lc-detail-actions" id="detail-actions">' + actionsHtml + '</div>';

            // Re-attach like button listener
            document.getElementById('detail-like-btn').addEventListener('click', handleDetailLike);

            // 添加删除按钮监听
            var deleteBtn = document.getElementById('detail-delete-btn');
            if (deleteBtn) {
                deleteBtn.addEventListener('click', handleDetailDelete);
            }

            // Render replies
            var replies = discussion.replies || [];
            var replySection = document.getElementById('reply-section');
            var replyFormSection = document.getElementById('reply-form-section');

            if (replies.length > 0) {
                replySection.hidden = false;
                document.getElementById('reply-count-label').textContent = replyCount + ' 条回复';
                var replyList = document.getElementById('reply-list');
                replyList.innerHTML = '';
                replies.forEach(function (reply) {
                    replyList.appendChild(makeReplyNode(reply));
                });
            }

            // Show reply form if logged in
            if (isLoggedIn) {
                replyFormSection.hidden = false;
            }

            document.title = title + ' · LiteCode · 讨论区';
        }

        function makeReplyNode(reply) {
            var div = document.createElement('div');
            div.className = 'lc-reply-item';
            var username = reply.user ? escapeHtml(reply.user.username) : '匿名用户';
            var content = escapeHtml(reply.content || '');
            var time = formatTime(reply.created_at);
            div.innerHTML =
                '<div class="lc-reply-item__header">' +
                    '<span class="lc-reply-item__author">' + username + '</span>' +
                    '<span class="lc-reply-item__time">' + time + '</span>' +
                '</div>' +
                '<div class="lc-reply-item__content">' + content + '</div>';
            return div;
        }

        function handleDetailLike() {
            if (!isLoggedIn) {
                alert('请先登录后再点赞');
                return;
            }
            var btn = document.getElementById('detail-like-btn');
            var id = parseInt(btn.dataset.id, 10);
            btn.disabled = true;
            litecode.api.discussions.like(id)
                .then(function (resp) {
                    document.getElementById('detail-like-count').textContent = resp.data.like_count || 0;
                    document.getElementById('detail-like-icon').textContent = resp.data.liked ? '❤️' : '🤍';
                    btn.disabled = false;
                })
                .catch(function (err) {
                    btn.disabled = false;
                    alert(err.message || '点赞失败');
                });
        }

        function handleDetailDelete() {
            if (!isLoggedIn) {
                alert('请先登录');
                return;
            }
            var btn = document.getElementById('detail-delete-btn');
            var id = parseInt(btn.dataset.id, 10);
            if (!confirm('确定要删除这条讨论吗？')) return;
            btn.disabled = true;
            btn.textContent = '删除中...';
            litecode.api.discussions.remove(id)
                .then(function () {
                    alert('删除成功');
                    window.location.href = '/discuss.html';
                })
                .catch(function (err) {
                    btn.disabled = false;
                    btn.textContent = '🗑️ 删除';
                    alert(err.message || '删除失败');
                });
        }

        function handleListDelete(id, btn) {
            if (!isLoggedIn) { alert('请先登录'); return; }
            if (!confirm('确定要删除这条讨论吗？')) return;
            btn.disabled = true;
            btn.textContent = '删除中...';
            litecode.api.discussions.remove(id)
                .then(function () {
                    alert('删除成功');
                    loadDiscussions(currentPage);
                })
                .catch(function (err) {
                    btn.disabled = false;
                    btn.textContent = '🗑️ 删除';
                    alert(err.message || '删除失败');
                });
        }

        function handleReply(e) {
            e.preventDefault();
            if (!isLoggedIn) {
                alert('请先登录后再回复');
                return;
            }
            var content = document.getElementById('reply-content').value.trim();
            if (!content) return;
            var btn = document.getElementById('submit-reply-btn');
            btn.disabled = true;
            btn.textContent = '发布中...';
            litecode.api.discussions.reply(currentDiscussionId, content)
                .then(function () {
                    document.getElementById('reply-content').value = '';
                    btn.disabled = false;
                    btn.textContent = '发布回复';
                    // Reload to show new reply
                    loadDiscussionDetail(currentDiscussionId);
                })
                .catch(function (err) {
                    btn.disabled = false;
                    btn.textContent = '发布回复';
                    alert(err.message || '回复失败');
                });
        }

        function handleCreate(e) {
            e.preventDefault();
            var titleInput = document.getElementById('discussion-title');
            var contentInput = document.getElementById('discussion-content');
            var btn = document.getElementById('submit-discussion-btn');

            if (!titleInput || !btn) {
                console.error('Discussion form elements not found');
                return;
            }

            var title = titleInput.value.trim();
            var content = '';
            if (contentInput) {
                content = getMdEditorValue().trim();
            }
            if (!title || !content) return;

            btn.disabled = true;
            btn.textContent = '发布中...';

            litecode.api.discussions.createGlobal(title, content)
                .then(function (resp) {
                    console.log('Discussion created successfully:', resp);
                    alert('发表成功！');
                    titleInput.value = '';
                    if (mdAceEditor) {
                        mdAceEditor.setValue('', -1);
                    } else if (contentInput) {
                        contentInput.value = '';
                    }
                    btn.disabled = false;
                    btn.textContent = '发布讨论';
                    loadDiscussions(0);
                })
                .catch(function (err) {
                    btn.disabled = false;
                    console.error('Failed to create discussion:', err);
                    btn.textContent = '发布讨论';
                    alert(err.message || '发布失败，请重试');
                });
        }

        function escapeHtml(str) {
            var div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        function formatTime(iso) {
            if (!iso) return '';
            var d = new Date(iso);
            if (isNaN(d.getTime())) return iso;
            var now = new Date();
            var diff = now - d;
            if (diff < 60000) return '刚刚';
            if (diff < 3600000) return Math.floor(diff / 60000) + ' 分钟前';
            if (diff < 86400000) return Math.floor(diff / 3600000) + ' 小时前';
            if (diff < 604800000) return Math.floor(diff / 86400000) + ' 天前';
            return d.toLocaleDateString('zh-CN');
        }

        init();
    })();
    </script>
</body>
</html>
