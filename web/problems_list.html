<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!--
      Phase 5 ★ CSP/SRI / SPEC §6.3 + A32
      Canonical CSP pinned in `web/js/csp.js` (single source of truth).
      The browser applies both this meta tag AND the matching header
      from Caddyfile, intersectionally. csp.js runtime-checks this
      tag against its expected value at load — if a future edit
      drifts, the browser console logs a clear error.

      v1.3.3.9 — problems_list.html splits the problem list off the
      landing page so /  is the marketing surface and /problems_list
      is the work surface. Same cache-busting `?v=` on every script.
    -->
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'">

    <meta name="description" content="LiteCode · 全部题目 · 按难度 + tag 筛选 · 在线判题">
    <meta name="theme-color" content="#F8F6F0">

    <title>LiteCode · 题库</title>

    <!--
      Phase 5 ★ 深色模式 / SPEC §6.3 / A34 — no-flash theme bootstrap.
      v1.3.4: 默认走 cyber dark 主题(详见 theme-boot.js)。
    -->
    <script src="/js/theme-boot.js?v=1.3.5"></script>
    <link rel="preload" href="/css/style.css?v=1.3.5" as="style">
    <link rel="stylesheet" href="/css/style.css?v=1.3.5">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23F8F6F0'/%3E%3Cpath d='M22 18 L42 32 L22 46' stroke='%234D7C5A' stroke-width='5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
</head>
<body class="lc-cyber">
    <div class="lc-cyber-grid-strip" aria-hidden="true"></div>

    <!-- v1.3.4 PR 8 ★ 装饰层(背景 spotlight 4角 watermark,aria-hidden) -->
    <div class="lc-v4-bg-oat"   aria-hidden="true"></div>
    <div class="lc-v4-bg-aurora" aria-hidden="true"></div>
    <div class="lc-v4-spotlight"  aria-hidden="true"></div>
    <div class="lc-v4-deco lc-v4-deco--tl" aria-hidden="true">
        <svg viewBox="0 0 60 60" fill="none"><path d="M4 50 L4 14 L40 4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
    <div class="lc-v4-deco lc-v4-deco--tr" aria-hidden="true">
        <svg viewBox="0 0 60 60" fill="none"><path d="M10 30 L48 30 M30 12 L30 48 M38 22 L48 30 L38 38" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
    <div class="lc-v4-deco lc-v4-deco--bl" aria-hidden="true">
        <svg viewBox="0 0 60 60" fill="none"><path d="M4 30 L40 30 M22 14 L4 30 L22 46" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
    <div class="lc-v4-deco lc-v4-deco--br" aria-hidden="true">
        <svg viewBox="0 0 60 60" fill="none"><path d="M56 10 L56 46 L20 56" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
    <div class="lc-v4-watermark lc-v4-watermark--br" aria-hidden="true">
        <svg viewBox="0 0 64 64"><path d="M22 18 L42 32 L22 46" stroke="currentColor" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>

    <!-- Navigation slot — app.js injects the shared nav here. -->
    <div data-nav></div>

    <!--
      v1.3.3.9 — problems_list.html page chrome. Uses lc-v4-page
      (the v4 standard) + lc-problems-list-page modifier so the
      wrapper widens to 1280px on desktop (vs the generic 1180px
      of `.lc-v4-page`). Filtering, list, pagination, and the
      hero-stat side-bar's data-feed live in the IIFE at the bottom.
    -->
    <main class="lc-v4-page lc-problems-list-page">

        <!--
          Page header — title + breadcrumb + refresh. v4 chrome
          keeps the eyebrow + title + lede trio so the design
          language matches the landing / problem-detail pages.
        -->
        <header class="lc-v4-page-header">
            <div class="lc-v4-page-header__row">
                <a href="/index.html">首页</a>
                <span>题库</span>
            </div>
            <div class="lc-v4-page-header__title-row">
                <h1 class="lc-v4-page-header__title">全部<em>题目</em></h1>
                <button type="button"
                        class="lc-btn lc-btn--ghost lc-btn--sm"
                        id="retry-btn-top"
                        aria-label="刷新题库"
                        style="margin-left: auto;">
                    <span aria-hidden="true">↻</span> 刷新
                </button>
            </div>
            <p class="lc-v4-page-header__lede">
                按难度 + 标签筛选;客户端搜索只过滤当前页内可见的题目。
            </p>
        </header>

        <!--
          Filter bar — controls the GET /api/v1/problems query string.
          Inputs:
            - search       — client-side title filter (debounced 250ms)
            - difficulty   — server-side filter: '' | 'easy' | 'medium' | 'hard'
            - tag chips    — server-side filter: ?tag_id=N (only one at a time)
          Every change pushes a new ?... state to history.replaceState so
          deep-links round-trip cleanly; popstate re-runs load() with the
          params the user came back to.
        -->
        <section class="lc-card lc-problem-filters lc-particles-host" aria-label="题目筛选">
            <!-- v1.3.4 PR 13 ★ scoped 粒子 canvas(深色模式下补全
                 筛选区真实粒子;原 viewport fixed canvas 被卡片
                 opaque 背景遮挡) -->
            <canvas class="lc-particles-canvas-scoped" aria-hidden="true"></canvas>
            <!-- v1.3.4 PR 15 ★ 紧凑型搜索行 — 原来只一个全宽
                 search input,左右两侧大量空白显得很空旷。这里把
                 搜索框收窄到 360px + 旁边并列 3 个信息 chip
                 (快捷键 / 数据范围提示 / 操作提示),保持视觉密度
                 又不抢主筛选区(难度/标签)的地位。 -->
            <div class="lc-problem-filters__row lc-problem-filters__row--search">
                <label class="lc-form-row lc-problem-filters__search"
                       style="flex: 0 1 360px; min-width: 240px;">
                    <span class="lc-form-label" for="search-input">搜索</span>
                    <input
                        type="search"
                        id="search-input"
                        class="lc-input"
                        placeholder="按标题筛选(仅当前页内生效)"
                        autocomplete="off"
                        aria-describedby="search-help">
                </label>
                <div class="lc-problem-filters__chips" aria-hidden="false">
                    <span class="lc-info-chip" title="按 / 聚焦搜索框">
                        <span aria-hidden="true">⌨</span> /
                    </span>
                    <span class="lc-info-chip" title="客户端搜索的范围">
                        <span aria-hidden="true">🎯</span> 当前页内
                    </span>
                    <span class="lc-info-chip" title="切页/改筛选会自动重新拉取">
                        <span aria-hidden="true">🔄</span> 切页重拉
                    </span>
                </div>
                <span id="search-help" class="lc-form-help lc-problem-filters__hint"
                      style="flex: 1 1 auto; min-width: 0; margin-left: auto;">
                    搜索只过滤当前页内已加载的题目;切换页或调整筛选条件会重新从后端拉取。
                </span>
            </div>

            <!--
              v1.3.4 PR 12 follow-up ★ 难度筛选 — 居中 + 丰富:
                - 结构改两行:第一行 heading(难度 + 选中态的描述),
                  第二行 4 个居中按钮(每个含 emoji + 文字 + 当前题数计数)
                - 4 个难度段标配符号:全部 📚,简单 🌶,中等 ⚡,困难 🔥
                - 计数段通过 data-count attribute 占位,渲染时
                  loadList() 完成后由 JS 从 lastPayload 统计填进去
                  (后端不带 per-difficulty count,所以前端从
                  当前页内 lastPayload.items 推断 + 静态后端默认
                  从 cache 拉一次无筛选的数据集;这里 fallback 到
                  visible-items 比例作为 quick preview)
            -->
            <div class="lc-problem-filters__row lc-problem-filters__row--difficulty"
                 role="group" aria-label="难度筛选">
                <div class="lc-problem-filters__heading">
                    <span class="lc-form-label">难度</span>
                    <span class="lc-problem-filters__heading-hint" id="difficulty-hint">
                        按题目的难度等级筛选
                    </span>
                </div>
                <div class="lc-seg lc-seg--centered" id="difficulty-seg" role="tablist">
                    <button type="button" class="lc-seg__btn lc-seg__btn--active"
                            data-difficulty="" role="tab" aria-selected="true">
                        <span class="lc-seg__btn-icon" aria-hidden="true">📚</span>
                        <span class="lc-seg__btn-text">全部</span>
                        <span class="lc-seg__btn-count" data-count="">—</span>
                    </button>
                    <button type="button" class="lc-seg__btn"
                            data-difficulty="easy" role="tab" aria-selected="false">
                        <span class="lc-seg__btn-icon" aria-hidden="true">🌶</span>
                        <span class="lc-seg__btn-text">简单</span>
                        <span class="lc-seg__btn-count" data-count="easy">—</span>
                    </button>
                    <button type="button" class="lc-seg__btn"
                            data-difficulty="medium" role="tab" aria-selected="false">
                        <span class="lc-seg__btn-icon" aria-hidden="true">⚡</span>
                        <span class="lc-seg__btn-text">中等</span>
                        <span class="lc-seg__btn-count" data-count="medium">—</span>
                    </button>
                    <button type="button" class="lc-seg__btn"
                            data-difficulty="hard" role="tab" aria-selected="false">
                        <span class="lc-seg__btn-icon" aria-hidden="true">🔥</span>
                        <span class="lc-seg__btn-text">困难</span>
                        <span class="lc-seg__btn-count" data-count="hard">—</span>
                    </button>
                </div>
            </div>

            <div class="lc-problem-filters__row" id="tag-row" hidden>
                <span class="lc-form-label">标签</span>
                <div class="lc-tag-chips" id="tag-chips" role="group" aria-label="标签筛选">
                    <!-- Filled by renderTagChips() at load time. -->
                </div>
            </div>

            <div class="lc-problem-filters__row lc-row lc-row--between">
                <span class="lc-form-help" id="filter-summary" aria-live="polite">共 0 题</span>
                <button type="button" class="lc-btn lc-btn--ghost lc-btn--sm"
                        id="reset-filters-btn">重置筛选</button>
            </div>
        </section>

        <!-- Result list / states. Exactly one of these is visible at a time. -->
        <section class="lc-stack-lg lc-fade-in" id="problem-list-wrap" aria-label="题目列表">
            <div class="lc-problem-list" id="problem-list" role="list">
                <div class="lc-problem-row lc-problem-row--skeleton" aria-hidden="true">
                    <div class="lc-problem-row__main">
                        <div class="lc-problem-row__head">
                            <span class="lc-pill">…</span>
                            <span class="lc-problem-row__title">正在加载题库…</span>
                        </div>
                    </div>
                    <div class="lc-problem-row__meta">
                        <span class="lc-problem-row__metric">— / —</span>
                    </div>
                </div>
            </div>

            <div class="lc-empty" id="empty-state" hidden>
                <p class="lc-empty__title">没有符合条件的题目</p>
                <p class="lc-form-help">试试调整筛选条件，或清空搜索框。</p>
            </div>

            <div class="lc-error" id="error-state" hidden role="alert">
                <p class="lc-error__title">加载失败</p>
                <p class="lc-form-help" id="error-message"></p>
                <button type="button" class="lc-btn lc-btn--primary lc-btn--sm"
                        id="retry-btn">重试</button>
            </div>

            <div class="lc-loading" id="loading-state" hidden aria-live="polite">
                <span class="lc-spinner" aria-hidden="true"></span>
                <span>加载中…</span>
            </div>

            <nav class="lc-pagination" id="pagination"
                 aria-label="分页" hidden></nav>
        </section>
    </main>

    <!-- No-JS fallback for crawlers / accessibility tooling. -->
    <noscript>
        <div style="max-width:680px;margin:32px auto;padding:16px;border:1px solid var(--lc-color-danger);border-radius:8px;color:var(--lc-color-text);background:var(--lc-color-surface-2);font:14px/1.5 system-ui;">
            <strong>LiteCode 需要 JavaScript 才能加载题目列表。</strong>
            请在浏览器启用脚本后刷新本页。如需离线查看,直接访问
            <a href="/api/v1/problems">/api/v1/problems</a>。
        </div>
    </noscript>

    <!--
      Load order is mandatory: csp.js → api.js → app.js.
      `defer` keeps every script after the [data-nav] slot is parsed.
    -->
    <script src="/js/csp.js?v=1.3.5" defer></script>
    <script src="/js/api.js?v=1.3.5" defer></script>
    <script src="/js/app.js?v=1.3.5" defer></script>
    <!-- v1.3.4 PR 8 ★ 鼠标跟随 + 入场动效 -->
    <script src="/js/mouse-deco.js?v=1.3.5" defer></script>
    <!-- v1.3.4 PR 12 ★ 鼠标粒子(深/浅双套 config,粒子数大幅增强) -->
    <script src="/js/mouse-particles.js?v=1.3.5" defer></script>
    <script src="/js/fade-in.js?v=1.3.5" defer></script>
    <!-- v1.3.4 PR 10 ★ idle 1h 自动登出 -->
    <script src="/js/idle-timeout.js?v=1.3.5" defer></script>

    <!-- v1.3.4 PR12 ★ 鼠标粒子 canvas(全屏 fixed,z-index:-1,pointer:none) -->
    <canvas id="lc-particles-canvas" aria-hidden="true"></canvas>

    <script>
    // ────────────────────────────────────────────────────────────────────
    //  Problem list page (Phase 5 ★ 题目列表页面 — /problems_list.html)
    //
    //  v1.3.3.9 — split off /index.html into a pure landing page;
    //  the problem list now lives at /problems_list.html. Same API
    //  surface, same filter / pagination logic, same row rendering
    //  helpers — only the host page chrome changed. The script is
    //  identical to what used to live inline in index.html's bottom
    //  IIFE.
    //
    //  Responsibilities:
    //    1) Read filter + pagination state from the URL on load so deep
    //       links round-trip (e.g. ?difficulty=easy&tag_id=2&page=3).
    //    2) Render a search box + segmented difficulty control + tag
    //       chips, driven by GET /api/v1/tags (one network call).
    //    3) Fetch GET /api/v1/problems on every state change, render
    //       the rows, and update the URL via history.replaceState so
    //       browser back/forward keeps working without flooding history.
    //    4) Render a paginator with first / prev / page numbers (with
    //       ellipsis for many pages) / next / last.
    //    5) Show loading / empty / error states and surface API failures
    //       through the standard `litecode:api-error` channel (app.js
    //       toast layer picks it up).
    //
    //  Out of scope (later commits):
    //    - Per-problem tag chips on the list rows (the public list API
    //      omits tags — see serialize_problem_row comment in
    //      src/routes/problem_routes.h. We'd need to call detail per
    //      row, which is N+1; not worth it for a list page).
    //    - Server-side title search (no backend param exists; today
    //      search filters within the current page client-side).
    // ────────────────────────────────────────────────────────────────────
    (function () {
        'use strict';

        // ── Constants ───────────────────────────────────────────────
        var DEFAULT_LIMIT    = 20;        // matches backend default
        var SEARCH_DEBOUNCE  = 250;       // ms
        var PROBLEM_DETAIL   = '/problem.html?slug=';

        // Allowed values per filter — kept in lock-step with backend
        // validation in problem_routes.h::detail::parse_difficulty_param.
        var DIFFICULTIES = ['', 'easy', 'medium', 'hard'];
        var DIFFICULTY_LABELS = { '': '全部', easy: '简单', medium: '中等', hard: '困难' };

        // ── Page state ──────────────────────────────────────────────
        var state = {
            difficulty: '',
            tagId:      null,
            tagName:    '',   // resolved from /tags list (for chip highlight)
            page:       1,
            limit:      DEFAULT_LIMIT,
            search:     '',   // client-side filter on loaded rows
        };

        var allTags = [];                 // cached /api/v1/tags items
        var lastPayload = null;           // { items, total, limit, offset }
        var searchTimer = null;
        var inflightToken = 0;            // monotonic; only the latest request renders

        // ── DOM refs ────────────────────────────────────────────────
        function $(id) { return document.getElementById(id); }

        var els = {};

        // ── URL state ───────────────────────────────────────────────
        function readUrl() {
            var sp = new URLSearchParams(window.location.search);
            var d = sp.get('difficulty') || '';
            if (DIFFICULTIES.indexOf(d) === -1) d = '';
            var tag = sp.get('tag_id');
            var tagId = tag && /^\d+$/.test(tag) ? parseInt(tag, 10) : null;
            var page = parseInt(sp.get('page') || '1', 10);
            if (!Number.isFinite(page) || page < 1) page = 1;
            var limit = parseInt(sp.get('limit') || String(DEFAULT_LIMIT), 10);
            if (!Number.isFinite(limit) || limit < 1) limit = DEFAULT_LIMIT;
            var q = sp.get('q') || '';
            return { difficulty: d, tagId: tagId, page: page, limit: limit, search: q };
        }

        function writeUrl(replace) {
            var sp = new URLSearchParams();
            if (state.difficulty) sp.set('difficulty', state.difficulty);
            if (state.tagId)      sp.set('tag_id', String(state.tagId));
            if (state.page > 1)   sp.set('page', String(state.page));
            if (state.limit !== DEFAULT_LIMIT) sp.set('limit', String(state.limit));
            if (state.search)     sp.set('q', state.search);
            var qs = sp.toString();
            var url = window.location.pathname + (qs ? '?' + qs : '');
            if (replace) window.history.replaceState(null, '', url);
            else         window.history.pushState(null, '', url);
        }

        // ── Rendering ───────────────────────────────────────────────
        function el(tag, attrs, children) {
            var node = document.createElement(tag);
            if (attrs) {
                Object.keys(attrs).forEach(function (k) {
                    if (k === 'class') node.className = attrs[k];
                    else if (k === 'text') node.textContent = attrs[k];
                    else if (k === 'dataset') {
                        Object.keys(attrs[k]).forEach(function (dk) {
                            node.dataset[dk] = attrs[k][dk];
                        });
                    } else if (k.charAt(0) === 'o' && k.charAt(1) === 'n') {
                        node.addEventListener(k.slice(2).toLowerCase(), attrs[k]);
                    } else {
                        node.setAttribute(k, attrs[k]);
                    }
                });
            }
            if (children !== undefined && children !== null) {
                (Array.isArray(children) ? children : [children]).forEach(function (c) {
                    if (c === null || c === undefined) return;
                    if (typeof c === 'string') node.appendChild(document.createTextNode(c));
                    else node.appendChild(c);
                });
            }
            return node;
        }

        function renderDifficultySeg() {
            var seg = $('difficulty-seg');
            while (seg.firstChild) seg.removeChild(seg.firstChild);
            DIFFICULTIES.forEach(function (d) {
                var active = (state.difficulty === d);
                // ★ PR 12 follow-up — 难度图标 + 文字 + 计数三段式
                var icons = { '': '📚', easy: '🌶', medium: '⚡', hard: '🔥' };
                var btn = el('button', {
                    type: 'button',
                    class: 'lc-seg__btn' + (active ? ' lc-seg__btn--active' : ''),
                    dataset: { difficulty: d },
                    role: 'tab',
                    'aria-selected': active ? 'true' : 'false',
                    onClick: function () { onDifficultyChange(d); },
                }, [
                    el('span', { class: 'lc-seg__btn-icon', 'aria-hidden': 'true', text: icons[d] }),
                    el('span', { class: 'lc-seg__btn-text', text: DIFFICULTY_LABELS[d] || '全部' }),
                    el('span', { class: 'lc-seg__btn-count', text: '—' }),
                ]);
                seg.appendChild(btn);
            });
        }

        // ★ PR 12 follow-up — 全量难度桶计数
        // 后端不带按难度的总题数接口,我们走 '?limit=200' 一次性
        // 拉足够样本 + 按 difficulty 分桶(题库本体就 13 道题,
        // 200 limit 足矣)。只跑一次,缓存到 difficultyCounts。
        var difficultyCounts = { '': 0, easy: 0, medium: 0, hard: 0 };
        var difficultyCountsLoaded = false;
        function loadDifficultyCounts() {
            if (difficultyCountsLoaded) return Promise.resolve();
            return litecode.api.get('/problems?limit=200')
                .then(function (resp) {
                    var items = (resp && resp.data && Array.isArray(resp.data.items)) ? resp.data.items : [];
                    var buckets = { easy: 0, medium: 0, hard: 0 };
                    items.forEach(function (it) {
                        if (it && buckets.hasOwnProperty(it.difficulty)) buckets[it.difficulty]++;
                    });
                    difficultyCounts.easy   = buckets.easy;
                    difficultyCounts.medium = buckets.medium;
                    difficultyCounts.hard   = buckets.hard;
                    difficultyCounts['']    = (resp && resp.data && typeof resp.data.total === 'number')
                        ? resp.data.total : items.length;
                    difficultyCountsLoaded = true;
                    applyDifficultyCounts();
                })
                .catch(function () {
                    // fallback:留 '—' 占位,不阻塞 UI
                });
        }
        function applyDifficultyCounts() {
            var seg = $('difficulty-seg');
            if (!seg) return;
            var btns = seg.querySelectorAll('.lc-seg__btn');
            btns.forEach(function (btn) {
                var d = btn.getAttribute('data-difficulty');
                var countEl = btn.querySelector('.lc-seg__btn-count');
                if (!countEl) return;
                var v = difficultyCounts.hasOwnProperty(d) ? difficultyCounts[d] : null;
                countEl.textContent = (v == null) ? '—' : String(v);
            });
        }

        function renderTagChips() {
            var row = $('tag-row');
            var wrap = $('tag-chips');
            while (wrap.firstChild) wrap.removeChild(wrap.firstChild);
            if (!allTags.length) {
                row.hidden = true;
                return;
            }
            row.hidden = false;

            // "全部" pill — clears tag filter
            var clearActive = (state.tagId === null);
            wrap.appendChild(el('button', {
                type: 'button',
                class: 'lc-tag-chip' + (clearActive ? ' lc-tag-chip--active' : ''),
                dataset: { tagId: '' },
                text: '全部',
                onClick: function () { onTagChange(null); },
            }));

            allTags.forEach(function (t) {
                if (!t || typeof t.id !== 'number' || !t.name) return;
                var active = (state.tagId === t.id);
                var chip = el('button', {
                    type: 'button',
                    class: 'lc-tag-chip' + (active ? ' lc-tag-chip--active' : ''),
                    dataset: { tagId: String(t.id), tagName: t.name },
                    text: t.name + ' (' + (t.problem_count || 0) + ')',
                    title: t.name,
                    onClick: function () { onTagChange(t.id); },
                });
                wrap.appendChild(chip);
            });
        }

        function acRate(p) {
            var sub = Number(p.submission_count) || 0;
            var ac  = Number(p.accepted_count)   || 0;
            if (sub <= 0) return '—';
            return ((ac / sub) * 100).toFixed(1) + '%';
        }

        function escapeText(s) {
            return String(s == null ? '' : s)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;');
        }

        function renderProblemRow(p) {
            var slug  = escapeText(p.slug);
            var title = escapeText(p.title);
            var diff  = escapeText(p.difficulty);
            var diffClass = ['easy', 'medium', 'hard'].indexOf(diff) !== -1
                ? 'lc-pill lc-pill--' + diff
                : 'lc-pill';

            var row = el('a', {
                href: PROBLEM_DETAIL + encodeURIComponent(p.slug),
                class: 'lc-problem-row',
                role: 'listitem',
                dataset: { slug: p.slug },
            });

            var main = el('div', { class: 'lc-problem-row__main' });
            var head = el('div', { class: 'lc-problem-row__head' });
            head.appendChild(el('span', { class: diffClass, text: DIFFICULTY_LABELS[diff] || diff }));
            head.appendChild(el('span', { class: 'lc-problem-row__title', text: p.title || '' }));
            main.appendChild(head);

            row.appendChild(main);

            // v1.3.5: 计数 0 → "—" 占位(避免「通过率 —」旁边出现「0 / 0」)
            var sub = Number(p.submission_count) || 0;
            var ac  = Number(p.accepted_count)   || 0;
            var fracText = (sub <= 0) ? '— / —' : (ac + ' / ' + sub);

            var meta = el('div', { class: 'lc-problem-row__meta' });
            meta.appendChild(el('span', {
                class: 'lc-problem-row__metric',
                text: '通过率 ' + acRate(p),
            }));
            meta.appendChild(el('span', {
                class: 'lc-problem-row__metric',
                text: fracText,
                title: '通过数 / 提交数',
            }));
            row.appendChild(meta);

            return row;
        }

        function renderRows() {
            var list = $('problem-list');
            var nodes = Array.prototype.slice.call(list.children);
            nodes.forEach(function (n) { list.removeChild(n); });

            var items = (lastPayload && Array.isArray(lastPayload.items)) ? lastPayload.items : [];

            var q = state.search.trim().toLowerCase();
            var filtered = q
                ? items.filter(function (p) {
                    return p && typeof p.title === 'string'
                        && p.title.toLowerCase().indexOf(q) !== -1;
                })
                : items;

            if (!filtered.length) {
                list.hidden = true;
                $('empty-state').hidden = false;
                return;
            }
            $('empty-state').hidden = true;
            list.hidden = false;
            filtered.forEach(function (p) {
                list.appendChild(renderProblemRow(p));
            });
        }

        function renderSummary() {
            var total = (lastPayload && typeof lastPayload.total === 'number') ? lastPayload.total : 0;
            var parts = ['共 ' + total + ' 题'];
            if (state.difficulty) parts.push('难度=' + DIFFICULTY_LABELS[state.difficulty]);
            if (state.tagId && state.tagName) parts.push('标签=' + state.tagName);
            if (state.search) parts.push('搜索="' + state.search + '"');
            $('filter-summary').textContent = parts.join(' · ');
        }

        function totalPages() {
            var t = (lastPayload && typeof lastPayload.total === 'number') ? lastPayload.total : 0;
            if (t <= 0) return 1;
            return Math.max(1, Math.ceil(t / state.limit));
        }

        function renderPagination() {
            var nav = $('pagination');
            while (nav.firstChild) nav.removeChild(nav.firstChild);
            var tp = totalPages();
            if (tp <= 1) {
                nav.hidden = true;
                return;
            }
            nav.hidden = false;

            var cur = state.page;

            function pageBtn(label, target, opts) {
                opts = opts || {};
                var attrs = {
                    type: 'button',
                    class: 'lc-page-btn'
                        + (opts.active ? ' lc-page-btn--active' : '')
                        + (opts.disabled ? ' lc-page-btn--disabled' : ''),
                    text: label,
                    dataset: { page: String(target) },
                    'aria-label': opts.ariaLabel || ('第 ' + target + ' 页'),
                    'aria-current': opts.active ? 'page' : null,
                };
                if (opts.disabled) {
                    attrs.disabled = true;
                } else {
                    attrs.onClick = function () { goToPage(target); };
                }
                return el('button', attrs);
            }

            function ellipsis() {
                return el('span', { class: 'lc-page-ellipsis', text: '…', 'aria-hidden': 'true' });
            }

            nav.appendChild(pageBtn('« 首页', 1, {
                disabled: cur === 1,
                ariaLabel: '首页',
            }));
            nav.appendChild(pageBtn('‹ 上一页', cur - 1, {
                disabled: cur === 1,
                ariaLabel: '上一页',
            }));

            var pages = [];
            if (tp <= 7) {
                for (var i = 1; i <= tp; i++) pages.push(i);
            } else {
                pages.push(1);
                if (cur > 3) pages.push('…');
                var from = Math.max(2, cur - 1);
                var to   = Math.min(tp - 1, cur + 1);
                for (var j = from; j <= to; j++) pages.push(j);
                if (cur < tp - 2) pages.push('…');
                pages.push(tp);
            }

            pages.forEach(function (p) {
                if (p === '…') nav.appendChild(ellipsis());
                else nav.appendChild(pageBtn(String(p), p, { active: p === cur }));
            });

            nav.appendChild(pageBtn('下一页 ›', cur + 1, {
                disabled: cur === tp,
                ariaLabel: '下一页',
            }));
            nav.appendChild(pageBtn('末页 »', tp, {
                disabled: cur === tp,
                ariaLabel: '末页',
            }));
        }

        // ── State transitions ───────────────────────────────────────
        function onDifficultyChange(d) {
            state.difficulty = d;
            state.page = 1;
            writeUrl(true);
            renderDifficultySeg();
            load();
        }

        function onTagChange(tagId) {
            state.tagId = (typeof tagId === 'number') ? tagId : null;
            state.tagName = '';
            if (state.tagId !== null) {
                var t = allTags.find(function (x) { return x && x.id === state.tagId; });
                if (t) state.tagName = t.name;
            }
            state.page = 1;
            writeUrl(true);
            renderTagChips();
            load();
        }

        function goToPage(p) {
            var tp = totalPages();
            if (p < 1) p = 1;
            if (p > tp) p = tp;
            if (p === state.page) return;
            state.page = p;
            writeUrl(true);
            var list = $('problem-list');
            if (list && list.scrollIntoView) list.scrollIntoView({ behavior: 'smooth', block: 'start' });
            load();
        }

        function onSearchInput() {
            if (searchTimer) clearTimeout(searchTimer);
            searchTimer = setTimeout(function () {
                state.search = els.searchInput.value || '';
                writeUrl(true);
                renderRows();
                renderSummary();
            }, SEARCH_DEBOUNCE);
        }

        function resetFilters() {
            state.difficulty = '';
            state.tagId = null;
            state.tagName = '';
            state.page = 1;
            state.search = '';
            els.searchInput.value = '';
            writeUrl(true);
            renderDifficultySeg();
            renderTagChips();
            load();
        }

        // ── Loading ──────────────────────────────────────────────────
        function showState(name) {
            ['loading-state', 'empty-state', 'error-state'].forEach(function (id) {
                $(id).hidden = true;
            });
            $('problem-list').hidden = true;
            if (name) $(name + '-state').hidden = false;
        }

        function loadTags() {
            return litecode.api.get('/tags').then(function (resp) {
                var items = (resp && resp.data && Array.isArray(resp.data.items)) ? resp.data.items : [];
                allTags = items;
                renderTagChips();
            }).catch(function (err) {
                console.warn('[problem-list] failed to load tags', err);
                allTags = [];
                renderTagChips();
            });
        }

        function load() {
            var token = ++inflightToken;
            showState('loading');

            var qs = '?limit=' + encodeURIComponent(state.limit)
                   + '&offset=' + encodeURIComponent((state.page - 1) * state.limit);
            if (state.difficulty) qs += '&difficulty=' + encodeURIComponent(state.difficulty);
            if (state.tagId)      qs += '&tag_id=' + encodeURIComponent(state.tagId);

            litecode.api.get('/problems' + qs)
                .then(function (resp) {
                    if (token !== inflightToken) return; // stale
                    lastPayload = (resp && resp.data) ? resp.data : { items: [], total: 0 };
                    renderSummary();
                    renderRows();
                    renderPagination();
                    $('problem-list').hidden = false;
                    $('loading-state').hidden = true;
                })
                .catch(function (err) {
                    if (token !== inflightToken) return; // stale
                    showState('error');
                    $('error-message').textContent = (err && err.message)
                        ? err.message
                        : '网络错误，请稍后重试';
                });
        }

        // ── Boot ────────────────────────────────────────────────────
        document.addEventListener('DOMContentLoaded', function () {
            litecode.boot.shell({ title: 'LiteCode · 题库' });

            // Hydrate state from URL.
            var u = readUrl();
            state.difficulty = u.difficulty;
            state.tagId      = u.tagId;
            state.page       = u.page;
            state.limit      = u.limit;
            state.search     = u.search;

            els.searchInput     = $('search-input');
            els.searchInput.value = state.search;

            renderDifficultySeg();

            // ★ PR 12 follow-up — 拉一次全量桶 + 渲染计数段
            loadDifficultyCounts();

            // Wire user controls.
            els.searchInput.addEventListener('input', onSearchInput);
            $('reset-filters-btn').addEventListener('click', resetFilters);
            $('retry-btn').addEventListener('click', function () { load(); });
            $('retry-btn-top').addEventListener('click', function () { load(); });

            // Back/forward: re-hydrate from URL and refetch. We tag the
            // user-initiated `pushState` ourselves by always using
            // replaceState — so popstate fires only when the user
            // actually navigates with the browser buttons.
            window.addEventListener('popstate', function () {
                var p = readUrl();
                state.difficulty = p.difficulty;
                state.tagId      = p.tagId;
                state.page       = p.page;
                state.limit      = p.limit;
                state.search     = p.search;
                els.searchInput.value = p.search;
                state.tagName = '';
                if (state.tagId !== null) {
                    var t = allTags.find(function (x) { return x && x.id === state.tagId; });
                    if (t) state.tagName = t.name;
                }
                renderDifficultySeg();
                renderTagChips();
                load();
            });

            // Load tags + first page in parallel.
            loadTags();
            load();
        });
    })();
    </script>
</body>
</html>
