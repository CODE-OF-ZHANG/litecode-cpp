# =============================================================
# LiteCode-CPP — Grafana dashboards provisioning
# =============================================================
# SPEC §16.3 / Phase 9 ★ Grafana 面板
# -------------------------------------------------------------
# 启动时自动加载 dashboards/*.json 作为系统概览 / 判题 / 错误率
# / 队列 / 资源 5 个 panel。Grafana 11+ 支持 file-based provisioning
# 的 folder + editable 字段——这里 folder=Phase9 表示不可由用户
# 删除，editable=false 防止误改。
# =============================================================

apiVersion: 1

providers:
  - name: 'LiteCode Phase 9'
    orgId: 1
    folder: 'LiteCode'
    type: file
    disableDeletion: true                # 防止 UI 删除（防误操作）
    updateIntervalSeconds: 30            # 30s 重读 file（编辑后可热更）
    allowUiUpdates: false                # UI 修改不会持久化（防漂移）
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
