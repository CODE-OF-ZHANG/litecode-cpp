# =============================================================
# LiteCode-CPP — Prometheus 抓取 / 告警配置
# =============================================================
# SPEC §16.2 / §16.4
# -------------------------------------------------------------
# 抓取目标：
#   1. litecode-web        — /api/v1/metrics（Phase 9 ★）
#   2. prometheus          — 自身健康
#   3. alertmanager        — 告警事件健康
#   4. cadvisor            — 容器资源（CPU / mem / net）（可选）
#   5. node-exporter       — 宿主机指标（可选）
#
# 告警规则：
#   - alerting/prometheus-alerts.yml（独立加载）
#   - alertmanager 静态 target：alertmanager:9093
# =============================================================

global:
  scrape_interval:     15s
  evaluation_interval: 15s
  external_labels:
    monitor: litecode-monitor
    env: dev                       # 生产改为 production

# ───── 告警规则（SPEC §16.4）─────────────────────────────
rule_files:
  - /etc/prometheus/alerts/*.yml

# ───── 告警管理器 ──────────────────────────────────────
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

# ───── 抓取目标 ─────────────────────────────────────────
scrape_configs:
  # 1. LiteCode Web 服务（核心指标：submissions_total / judge_duration / queue / pool）
  - job_name: litecode-web
    metrics_path: /api/v1/metrics
    scheme: http
    scrape_timeout: 10s            # metrics 端点返回可能较慢（histogram 多）
    static_configs:
      - targets:
          - 'litecode-web:8080'
        labels:
          service: web
          tier: application

  # 2. Prometheus 自身
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  # 3. Alertmanager 健康抓取
  - job_name: alertmanager
    static_configs:
      - targets: ['alertmanager:9093']

  # 4. cAdvisor（容器资源 — Phase 9 ☆ 资源面板数据源）
  - job_name: cadvisor
    static_configs:
      - targets: ['cadvisor:8080']
        labels:
          service: cadvisor
          tier: infrastructure

  # 5. Node exporter（宿主机磁盘 / 内存 / CPU）
  - job_name: node
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          service: host
          tier: infrastructure
