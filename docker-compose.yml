# =============================================================
# LiteCode-CPP — Docker Compose 开发环境
# =============================================================
# SPEC §11 Phase 1 / §15.5 / Phase 7
# -------------------------------------------------------------
# 一键启动：  docker compose up -d
# 销毁重建：  docker compose down -v
# 仅启基础：  docker compose up -d mysql docker-proxy web
# 启用监控：  docker compose --profile monitoring up -d
# 启用日志：  docker compose --profile logging up -d
# 监控+日志： docker compose --profile monitoring --profile logging up -d
# 启用反向代理： docker compose --profile proxy up -d
# -------------------------------------------------------------
# 服务拓扑：
#   ┌────────┐    ┌──────────────┐    ┌─────────────┐
#   │  web   │───▶│ docker-proxy │───▶│ Docker Host │
#   └────┬───┘    └──────────────┘    │ (判题容器)  │
#        │                            └─────────────┘
#        ▼
#   ┌────────┐
#   │ mysql  │
#   └────────┘
# =============================================================

name: litecode

# ───── 公共环境变量 ──────────────────────────────────────────
# 所有变量从项目根目录的 .env 文件读取（.env.example 是模板）。
# 实际部署时请 `cp .env.example .env` 并修改 JWT_SECRET / 密码。
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"     # SPEC §16.6：单文件 10MB
    max-file: "3"       # 保留 3 个轮转文件

services:

  # ───── 1. MySQL 8.0 ────────────────────────────────────────
  # SPEC §4.x / §10：UTF8MB4，支持 UNIQUE NULLS NOT DISTINCT（≥ 8.0.19）
  mysql:
    image: mysql:8.0.40
    container_name: litecode-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass_change_me}
      MYSQL_DATABASE:      ${DB_NAME:-litecode}
      MYSQL_USER:          ${DB_USER:-litecode}
      MYSQL_PASSWORD:      ${DB_PASSWORD:-changeme}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=caching_sha2_password
      - --max_connections=200
      # SPEC v1.2：保留 90 天前失败提交清理所需的窗口
      - --binlog_expire_logs_seconds=604800
    volumes:
      - mysql-data:/var/lib/mysql
      # 首次启动时由 docker-entrypoint-initdb.d 自动按文件名字母序执行：
      #   V001__init.sql → V006__add_ole_se_status.sql → V099__create_admin.sql
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    networks:
      - litecode-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-rootpass_change_me}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging: *default-logging
    # 资源限制（MySQL 默认会吃满内存，给个上限）
    deploy:
      resources:
        limits:
          memory: 1024M

  # ───── 2. Docker Socket 代理 ────────────────────────────────
  # SPEC §3.1 / §15.5：白名单 5 子命令
  #   - POST /containers/create
  #   - POST /containers/{id}/start
  #   - POST /containers/{id}/exec
  #   - POST /containers/{id}/kill
  #   - DELETE /containers/{id}
  # Web 通过 DOCKER_SOCKET_URL=tcp://docker-proxy:2375 访问
  docker-proxy:
    image: tecnativa/docker-socket-proxy:0.1
    container_name: litecode-docker-proxy
    restart: unless-stopped
    environment:
      # 5 个白名单子命令（精确控制）
      CONTAINERS: 1              # 启用容器相关子命令
      POST: 1                    # 容器操作需要 POST（创建/启动/执行/删除）
      IMAGES: 0                  # 禁止镜像管理
      NETWORKS: 0                # 禁止网络管理
      VOLUMES: 0                 # 禁止卷管理
      EVENTS: 0                  # 禁止事件订阅
      EXEC: 1                    # 允许容器 exec（判题时在容器内运行程序需要）
      PING: 1                    # 健康检查需要
      INFO: 1                    # /info 端点
      VERSION: 1                 # /version 端点
      # 由 tecnativa 镜像的 entrypoint 脚本读取上述变量构建白名单
      LOG_LEVEL: info
    volumes:
      # 只读挂载 socket（关键！SPEC §15.5）
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # v1.2.50: 不再需要把 task.json 目录挂到这里——named volume
      # (见 web 服务和文件末尾 judge-tmp volume) 解决了 Docker
      # Desktop host-VM 路径穿越问题。proxy 只转发容器创建请求，
      # 不参与文件系统层。
    networks:
      - litecode-net
    # 端口只暴露给本网络，外部不开放
    expose:
      - "2375"
    # 代理本身是 Go 单文件静态二进制，资源占用很低
    deploy:
      resources:
        limits:
          memory: 64M
    # v1.2.57 健康检查：tecnativa 镜像仅暴露 /v1.41/containers/json 等
    # 受白名单控制的端点；这里用 `nc -z`（busybox nc 支持）做 TCP 端口
    # 可达性探测 —— 端口 listen 即视为健康；HTTP 协议级校验交给 web
    # 容器实际跑判题任务时再验证。
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 2375 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    logging: *default-logging

  # ───── 3. 判题镜像（构建目标）───────────────────────────────
  # SPEC §7.2：判题仅作为镜像使用，web 每次提交动态 docker run。
  # 此服务只在 web 启动前构建一次（build 完成后立即退出）。
  # 注意：必须放在默认 profile 中，否则 web 的 depends_on 引用不到。
  judge:
    image: litecode-judge:latest
    build:
      context: ./judge
      dockerfile: Dockerfile
    container_name: litecode-judge-build
    # 构建完成后立即退出（不常驻）
    command: ["true"]
    # 不加入业务网络（纯构建步骤；显式空数组，避免被默认网络纳入）
    networks: []
    logging: *default-logging

  # ───── 4. Web 服务（C++ HTTP 服务器）─────────────────────
  # SPEC §11 Phase 1：多线程 HTTP 服务
  # 连接：
  #   - DB_HOST=mysql          （同网络别名）
  #   - DOCKER_SOCKET_URL=tcp://docker-proxy:2375
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # 如未来需要切换 base 镜像，可在此覆盖
        BUILDKIT_INLINE_CACHE: 1
    image: litecode-web:latest
    container_name: litecode-web
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      docker-proxy:
        condition: service_healthy      # v1.2.57: 等 proxy healthcheck 通过
      judge:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      # 覆盖 .env 中的 DB_HOST（容器内用网络别名而非 127.0.0.1）
      DB_HOST: mysql
      DB_PORT: 33060                      # mysql-connector-c++ X Protocol port (default 33060)
      DB_USER: ${DB_USER:-litecode}
      DB_PASSWORD: ${DB_PASSWORD:-changeme}
      DB_NAME: ${DB_NAME:-litecode}
      DB_POOL_MIN: 4
      DB_POOL_MAX: 16
      # v1.2.50: 共享卷下子路径。web 写入 /tmp/litecode-judge/X/task.json，
      # 判题容器通过 named volume mount 同一份 backing storage。
      # 若不设此 env，judge_scheduler 会回退到 std::filesystem::temp_directory_path()。
      JUDGE_TASK_DIR_PARENT: /tmp/litecode-judge
      # v1.2.50: 同一 named volume 的 docker-side 名字。web 容器
      # （写入端）和判题容器（读取端）都引用这个名字，docker daemon
      # 在自己存储区内解析到同一份数据——无需任何 host 路径。
      # 留空则回退到 bind mount（legacy / Linux-host dev 行为）。
      JUDGE_TASK_VOLUME_NAME: litecode-judge-tmp
      # 通过 socket 代理访问 Docker
      DOCKER_SOCKET_URL: tcp://docker-proxy:2375
      JUDGE_IMAGE: litecode-judge:latest
      # 日志：JSON 到 stdout，由 docker log driver 接管
      LOG_FORMAT: json
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # 健康检查监听
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 8080
      SERVER_THREAD_POOL_SIZE: ${SERVER_THREAD_POOL_SIZE:-8}
      # 时区
      TZ: Asia/Shanghai
    volumes:
      # 日志目录（容器写、宿主机可观察）。注意：uid 1000 写入宿主机
      # ./logs 时若目录属主为 root 会失败 —— 首次启动前在 host 上
      # `chown -R 1000:1000 logs` 或 `mkdir -p logs && chmod 777 logs`
      # （README 部署文档有详细步骤）。
      - ./logs:/app/logs
      # 题库数据（管理员导入/读取 JSON）
      - ./problems:/app/problems:ro
      # 前端静态资源（开发时可热更新；生产应固化进镜像）
      - ./web:/app/web:ro
      # v1.2.50: 改回 named volume（早期 bind-mount 路径因 Docker
      # Desktop host-VM 边界断裂了——web 容器写到容器内 /tmp，host
      # docker daemon 看不到）。named volume 存在 docker daemon 的
      # 存储区里，web 容器和判题容器都能挂载到同一个 backing
      # storage——不需要穿越 host 文件系统。
      - judge-tmp:/tmp/litecode-judge
      # v1.3.4 PR 9: 用户上传头像(以及其他未来上传资源)持久化。
      # 用 named volume 便于将来横向扩展 web 容器时共享。
      - litecode-uploads:/app/uploads
    networks:
      - litecode-net
    ports:
      # 仅暴露给反向代理或本地；生产由 Caddy 接管 80/443
      - "${WEB_BIND:-127.0.0.1}:8080:8080"
    # SPEC §15.5：Web 容器资源硬限制
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 512M
        reservations:
          cpus: "0.5"
          memory: 128M
    # SPEC §15.5：非 root 运行。镜像 Dockerfile 第 113-119 行已创建
    # uid=1000 的 litecode 用户并切到 USER litecode；这里显式声明是
    # 双重保险（覆盖任何第三方 child 镜像的 USER 变化）。
    #
    # 注意：与宿主机 ./logs、./problems、./web 的写权限要求：
    #   - logs  : web 需写 → host 上 chown 1000:1000 logs/ 或 chmod 777
    #   - problems : 镜像 USER 需只读 → :ro 已满足，UID 无所谓
    #   - web  : 同上，:ro 已满足
    # v1.2.57 修复：历史版本写过 user: "0:0" 是因 judge-tmp named volume
    # 在某些 host 上有 uid 错位 bug；但当前 docker daemon 已自动 chown，
    # 切回 1000 不再有问题。详见 docs/deployment.md 的"权限前置"。
    user: "1000:1000"
    # SPEC §15.5：禁止提权（防 setuid binary / capability 注入）
    security_opt:
      - no-new-privileges:true
    # 健康检查在镜像 HEALTHCHECK 中已定义，此处可省略
    logging: *default-logging

  # ───── 5. Caddy 反向代理（可选，profile=proxy 启用）───────
  # SPEC §11 Phase 1 / Phase 7 / v1.2.76 ★ Caddyfile 双模式：
  #   - CADDY_MODE=local（默认）：挂 caddy/Caddyfile.local（HTTP :80）
  #   - CADDY_MODE=prod：         挂 caddy/Caddyfile.prod（HTTPS + on_demand TLS）
  # 双模式由 entrypoint 脚本按 CADDY_MODE 拷贝对应文件到
  # /etc/caddy/Caddyfile，Caddy 自身只读一个文件，配置语法保持简单。
  caddy:
    image: caddy:2.8-alpine
    container_name: litecode-caddy
    restart: unless-stopped
    profiles: ["proxy"]
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
    environment:
      # v1.2.76：双模式开关
      CADDY_MODE: ${CADDY_MODE:-local}    # local | prod
      # prod 模式必填，注入到 Caddyfile.prod 的 site address
      LITECODE_DOMAIN: ${LITECODE_DOMAIN:-example.com}
    volumes:
      # 挂整个 caddy/ 目录；entrypoint 按 CADDY_MODE 选 Caddyfile.local
      # 或 Caddyfile.prod 拷到 /etc/caddy/Caddyfile。
      - ./caddy:/etc/caddy/conf:ro
      - caddy-data:/data
      - caddy-config:/config
    # v1.2.76：entrypoint 切换 + Caddy 验证配置后启动
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        case "$${CADDY_MODE:-local}" in
          prod)  SRC=/etc/caddy/conf/Caddyfile.prod  ;;
          *)     SRC=/etc/caddy/conf/Caddyfile.local ;;
        esac
        echo "[caddy] CADDY_MODE=$${CADDY_MODE:-local} → $$SRC"
        cp "$$SRC" /etc/caddy/Caddyfile
        # Caddyfile.prod 顶层用 {$LITECODE_DOMAIN:example.com} 占位
        # （Caddy env 引用语法），此处用 sed 替换避免依赖 busybox
        # envsubst（不同镜像版本行为差异）。local 模式不引用此变量，
        # sed 替换是 no-op。
        sed -i 's/$${LITECODE_DOMAIN:example.com}/$${LITECODE_DOMAIN:-example.com}/g' /etc/caddy/Caddyfile
        echo "[caddy] rendered Caddyfile (first 40 lines):"
        sed -n '1,40p' /etc/caddy/Caddyfile
        # Caddy 自带 `caddy validate` 子命令，失败会非 0 退出
        caddy validate --config /etc/caddy/Caddyfile --adapter ''
        exec caddy run --config /etc/caddy/Caddyfile --adapter ''
    networks:
      - litecode-net
    # 资源硬上限（caddy 内存占用通常 < 50M，给 128M 足够）
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
    # v1.2.76：healthcheck 通过 caddy 自带的 admin API（已关掉）
    # 改用 HTTP 探活 —— 200 即视为健康。
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- --tries=1 http://127.0.0.1:80/ >/dev/null 2>&1 || wget -qO- --tries=1 https://127.0.0.1:443/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging: *default-logging

  # ───── 6. Prometheus（可选，profile=monitoring 启用）───────
  prometheus:
    image: prom/prometheus:v2.55.0
    container_name: litecode-prometheus
    restart: unless-stopped
    profiles: ["monitoring"]
    depends_on:
      web:
        condition: service_started   # 不等 healthy — /metrics 是可选端口
      alertmanager:
        condition: service_started
    ports:
      - "${PROMETHEUS_BIND:-127.0.0.1}:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # 告警规则（Phase 7 ☆ / SPEC §16.4）
      - ./monitoring/alerting:/etc/prometheus/alerts:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
      # v1.2.57：每次 reload 配置时优雅生效（不丢抓取）
      - "--web.enable-lifecycle"
    networks:
      - litecode-net
    # 资源硬上限（TSDB + web UI 总和）
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging: *default-logging

  # ───── 6a. Alertmanager（Phase 7 ☆ / SPEC §16.4）──────────
  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: litecode-alertmanager
    restart: unless-stopped
    profiles: ["monitoring"]
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
    ports:
      - "${ALERTMANAGER_BIND:-127.0.0.1}:${ALERTMANAGER_PORT:-9093}:9093"
    volumes:
      - ./monitoring/alerting/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    networks:
      - litecode-net
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9093/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging: *default-logging

  # ───── 6b. cAdvisor（容器资源 — Phase 9 ☆）───────────────────
  # 抓取 Docker 容器 CPU / 内存 / 网络；Grafana 资源面板数据源
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: litecode-cadvisor
    restart: unless-stopped
    profiles: ["monitoring"]
    # cadvisor 必须特权挂载宿主机文件系统（只读）才能枚举容器
    privileged: true                  # SPEC §15.5 例外：cAdvisor 本身只读
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "${CADVISOR_BIND:-127.0.0.1}:${CADVISOR_PORT:-8088}:8080"
    networks:
      - litecode-net
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    logging: *default-logging

  # ───── 6c. node-exporter（宿主机指标 — Phase 9 ☆）───────────
  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: litecode-node-exporter
    restart: unless-stopped
    profiles: ["monitoring"]
    command:
      - "--path.rootfs=/host"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    volumes:
      - /:/host:ro,rslave
    ports:
      - "${NODE_EXPORTER_BIND:-127.0.0.1}:${NODE_EXPORTER_PORT:-9100}:9100"
    networks:
      - litecode-net
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 64M
    pid: host                         # 需要看宿主进程
    logging: *default-logging

  # ───── 7. Grafana（可选，profile=monitoring 启用）─────────
  grafana:
    image: grafana/grafana:11.2.0
    container_name: litecode-grafana
    restart: unless-stopped
    profiles: ["monitoring"]
    depends_on:
      prometheus:
        condition: service_healthy
    ports:
      - "${GRAFANA_BIND:-127.0.0.1}:${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin_change_me}
      GF_USERS_ALLOW_SIGN_UP: "false"
      # Phase 9 ★：provisioning 文件已挂载时允许 UI 编辑（read-only = false）
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_LOG_MODE: "console"
    volumes:
      - ./monitoring/grafana/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      # v1.2.57 Phase 9 ★：dashboards provisioning（系统/判题/错误率/队列/资源）
      - ./monitoring/grafana/dashboards/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      # dashboard JSON 文件实际目录（Grafana 从这里加载）
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    networks:
      - litecode-net
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging: *default-logging

  # ───── 7a. Loki（可选，profile=logging 启用）──────────────
  # Loki 只保存 Docker json-file 的集中副本；默认部署不拉起它。
  loki:
    image: grafana/loki:3.1.1
    container_name: litecode-loki
    restart: unless-stopped
    profiles: ["logging"]
    command:
      - "-config.file=/etc/loki/loki-config.yml"
    ports:
      - "${LOKI_BIND:-127.0.0.1}:${LOKI_PORT:-3100}:3100"
    volumes:
      - ./monitoring/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki
    networks:
      - litecode-net
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3100/ready | grep -q ready"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
    logging: *default-logging

  # ───── 7b. Promtail（可选，profile=logging 启用）───────────
  # 只读 Docker socket + json-file 目录，发现 litecode-* 容器并推送 Loki。
  promtail:
    image: grafana/promtail:3.1.1
    container_name: litecode-promtail
    restart: unless-stopped
    profiles: ["logging"]
    depends_on:
      loki:
        condition: service_healthy
    command:
      - "-config.file=/etc/promtail/promtail-config.yml"
    volumes:
      - ./monitoring/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - promtail-positions:/tmp/positions
    networks:
      - litecode-net
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
    logging: *default-logging

  # ───── 8. 数据库备份（Phase 7 ☆ / SPEC §16.5）────────────────
  # alpine 镜像 + mysql-client + dcron + zstd + rclone，自带 mysqldump
  # 且体积小（~80MB）。默认 24h 一次 + 保留 14 天 + 可选 rclone 异地。
  # 手动跑：  docker compose --profile backup up backup
  #          或：docker compose exec backup /usr/local/bin/backup.sh
  backup:
    image: alpine:3.20
    container_name: litecode-backup
    restart: unless-stopped
    profiles: ["backup"]              # 默认不启；--profile backup 才拉起
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      MYSQL_HOST: ${MYSQL_HOST:-mysql}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:-changeme_root}
      DB_NAME: ${DB_NAME:-litecode}
      BACKUP_DIR: /backup
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_COMPRESS: ${BACKUP_COMPRESS:-gzip}
      RCLONE_REMOTE: ${RCLONE_REMOTE:-}
      TZ: Asia/Shanghai
    volumes:
      - ./scripts/backup.sh:/usr/local/bin/backup.sh:ro
      - backup-data:/backup
    # alpine 缺客户端：装 mysql-client (含 mysqldump) + dcron + rclone + 压缩工具
    # 然后注册 cron 03:00 跑一次（前缀 cron env 注入 MYSQL_PASSWORD）
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "set -e;
         apk add --no-cache mysql-client dcron zstd rclone bash tzdata >/dev/null;
         cp /usr/share/zoneinfo/Asia/Shanghai /etc/localtime 2>/dev/null || true;
         printf '%s' \"$${MYSQL_PASSWORD}\" > /tmp/_dbpw;
         (umask 077; printf 'SHELL=/bin/sh
PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
MYSQL_HOST=%s
MYSQL_PORT=%s
MYSQL_USER=%s
MYSQL_PASSWORD=%s
DB_NAME=%s
BACKUP_DIR=%s
BACKUP_RETENTION_DAYS=%s
BACKUP_COMPRESS=%s
RCLONE_REMOTE=%s
TZ=%s
0 3 * * * /usr/local/bin/backup.sh >> /backup/backup.log 2>&1
' \"$$MYSQL_HOST\" \"$$MYSQL_PORT\" \"$$MYSQL_USER\" \"$$(cat /tmp/_dbpw)\" \"$$DB_NAME\" \"$$BACKUP_DIR\" \"$$BACKUP_RETENTION_DAYS\" \"$$BACKUP_COMPRESS\" \"$$RCLONE_REMOTE\" \"$$TZ\" > /etc/crontabs/root);
         rm -f /tmp/_dbpw;
         echo '[backup] cron registered; starting crond';
         crond -f -L /backup/crond.log"
    networks:
      - litecode-net
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    logging: *default-logging

# ───── 网络 ──────────────────────────────────────────────────
# 单一自定义网络；容器间通过服务名互通
networks:
  litecode-net:
    driver: bridge
    name: litecode-net

# ───── 命名卷 ────────────────────────────────────────────────
volumes:
  mysql-data:
    name: litecode-mysql-data
  caddy-data:
    name: litecode-caddy-data
  caddy-config:
    name: litecode-caddy-config
  prometheus-data:
    name: litecode-prometheus-data
  grafana-data:
    name: litecode-grafana-data
  alertmanager-data:
    name: litecode-alertmanager-data
  backup-data:
    name: litecode-backup-data
  # v1.2.50: named volume — shared between web (write task.json) and
  # the per-task judge container (mount at /tmp/task.json). Lives in
  # /var/lib/docker/volumes/ on the docker daemon side, so the host
  # filesystem is NEVER involved (works on Docker Desktop where bind
  # mounts break). First-mount auto-creates the volume.
  judge-tmp:
    name: litecode-judge-tmp
  loki-data:
    name: litecode-loki-data
  promtail-positions:
    name: litecode-promtail-positions
  # v1.3.4 PR 9: 用户上传资源 named volume(头像等)。
  # web 容器写 /app/uploads,server.mount("/uploads", ...) 静态服务。
  litecode-uploads:
    name: litecode-uploads