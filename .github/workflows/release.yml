# =============================================================
# LiteCode-CPP — Release workflow
# =============================================================
# SPEC §15.8 / Phase 8 ★ CI/CD 流水线 (release 部分)
# -------------------------------------------------------------
# 触发器：git tag 推送（v*.*.*）+ workflow_dispatch
# 动作：
#   1. 跑完整 CI（lint + build + integration-test）
#   2. 多架构 Docker build（amd64 + arm64）
#      - web → ghcr.io/<owner>/litecode-web:<tag>
#      - judge → ghcr.io/<owner>/litecode-judge:<tag>
#   3. 创建 GitHub Release（自动生成 changelog 从 commit log）
#
# 与 ci.yml 的区别：
#   - 多架构 buildx（linux/amd64 + linux/arm64）
#   - 镜像打 semver tag（v1.2.58 而不是 sha）
#   - 创建 GitHub Release 页面
#   - 触发频率低（只在 tag 推送 / 手动）
# =============================================================

name: Release

on:
  push:
    tags: ['v*.*.*']                     # 只 vX.Y.Z，不匹配 v1.2.57-rc1
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry-run（构建镜像但不推 / 不创建 Release）'
        type: boolean
        default: false

# Release 不并发；同一 tag 顺序执行
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  BUILD_TYPE: Release
  USE_LOCAL_DEPS: "ON"
  LITECODE_BUILD_TESTS: "ON"
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}

jobs:
  # ───── Pre-flight: 跑完整 ci.yml 的 jobs ─────────────────────
  ci:
    name: CI (full suite)
    uses: ./.github/workflows/ci.yml

  # ───── 多架构 Docker build + push ─────────────────────────────
  docker:
    name: Docker Multi-arch Build
    runs-on: ubuntu-22.04
    needs: ci
    timeout-minutes: 45
    permissions:
      contents: write              # 创建 release 需要
      packages: write              # 推 GHCR 需要
      id-token: write              # cosign 签名（可选 TODO）
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0           # full history 给 changelog

      - name: Extract version
        id: version
        run: |
          # tag 形如 v1.2.58；去掉 v 前缀
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(date +%Y%m%d-%H%M%S)-manual"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          echo "Version: ${VERSION}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push' && !inputs.dry_run
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image metadata
        id: meta-web
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/litecode-web
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      - name: Compute judge metadata
        id: meta-judge
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/litecode-judge
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build + push web (multi-arch)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' && !inputs.dry_run }}
          tags: ${{ steps.meta-web.outputs.tags }}
          labels: ${{ steps.meta-web.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Build + push judge (multi-arch)
        uses: docker/build-push-action@v6
        with:
          context: ./judge
          file: judge/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' && !inputs.dry_run }}
          tags: ${{ steps.meta-judge.outputs.tags }}
          labels: ${{ steps.meta-judge.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ───── GitHub Release 页面 ─────────────────────────────────
      - name: Generate changelog
        if: github.event_name == 'push' && !inputs.dry_run
        id: changelog
        run: |
          # 从上一个 tag 到现在之间的 commit message（首行）
          PREV_TAG=$(git tag --sort=-version:refname | grep -v "^${GITHUB_REF_NAME}$" | head -1 || echo "")
          if [ -n "$PREV_TAG" ]; then
            RANGE="${PREV_TAG}..${GITHUB_REF_NAME}"
          else
            RANGE="$(git rev-list --max-parents=0 HEAD | tail -1)..HEAD"
          fi
          {
            echo "## Changes since ${PREV_TAG:-initial}"
            echo ""
            git log "${RANGE}" --pretty=format:"- %s (%h)" --no-merges
          } > changelog.md
          cat changelog.md

      - name: Create GitHub Release
        if: github.event_name == 'push' && !inputs.dry_run
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: changelog.md
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') }}
          fail_on_unmatched_files: true
